  const order = mode === 'catalog' ? [] : (content.presentation?.[kind === 'function' ? 'function_order' : 'industry_order'] ?? []);
  const ranks = new Map(order.map((id, i) => [id, i]));
  return [...items].sort((a, b) => (ranks.get(a.id) ?? 999) - (ranks.get(b.id) ?? 999) || a.id.localeCompare(b.id));
}
function presentationRanks(content, filters = {}) {
  const p = content.presentation ?? {};

  const order = [...new Set([...(contexts[filters.functionId] ?? []), ...(contexts[filters.industryId] ?? []), ...(p.scene_order ?? [])])];
  return new Map(order.map((id, i) => [id, i]));
}

function readStore(raw,content){if(!raw)return {data:blankStore(),error:null,raw:null};try{const x=JSON.parse(raw);if(!['workmap-map-preview-state-2','workmap-map-preview-state-3'].includes(x.schema)||!Array.isArray(x.drafts)||!Array.isArray(x.bookmarks)||!Array.isArray(x.legacyBackups))throw Error('存档结构不兼容');if(x.drafts.length>200||x.legacyBackups.length>30)throw Error('存档超出当前容量');const drafts=x.drafts.map(d=>cleanDraft(d,content));if(drafts.some(d=>!d.id)||new Set(drafts.map(d=>d.id)).size!==drafts.length)throw Error('存档编号重复或缺失');const ids=new Set(content.scenarios.map(s=>s.id));if(x.bookmarks.some(id=>!ids.has(id)))throw Error('收藏指向未知工作');const legacyBackups=x.legacyBackups.map(v=>{if(!v||typeof v.raw!=='string'||v.raw.length>MAX_FILE_BYTES||typeof v.name!=='string'||typeof v.id!=='string')throw Error('历史备份记录异常');return {id:v.id,name:v.name,raw:v.raw,importedAt:String(v.importedAt||'')};});return {data:{schema:'workmap-map-preview-state-3',drafts,bookmarks:[...new Set(x.bookmarks)],legacyBackups},error:null,raw:null,migrated:x.schema!=='workmap-map-preview-state-3'};}catch(e){return {data:blankStore(),error:'已发现不兼容或损坏的存档，暂停写入并保护原内容。'+e.message,raw};}}
function parseImport(raw,content){if(typeof raw!=='string'||new TextEncoder().encode(raw).length>MAX_FILE_BYTES)throw Error('文件超过1 MB；未导入，不会截断内容。');let x;try{x=JSON.parse(raw)}catch{throw Error('这不是有效JSON备份；当前工作没有改变。');}if(!x||typeof x!=='object')throw Error('备份需为对象或记录列表。');if(x.kind===BACKUP_KIND){if(![2,3].includes(x.version)||!Array.isArray(x.drafts)||x.drafts.length>200)throw Error('备份版本或数量不兼容。');return {type:'drafts',drafts:x.drafts.map((d,i)=>cleanDraft(d,content,`import-${i}`)),count:x.drafts.length,preserveOriginal:x.version===2};}if(x.schema==='workmap-guide-draft-1')return {type:'drafts',drafts:[cleanDraft(x,content,'import-0')],count:1,preserveOriginal:true};return {type:'legacy',raw,parsed:x,count:1};}
function infoProgress(content,draft){const sc=content.scenarios.find(s=>s.id===draft.scenarioId),map=new Map((draft.information||[]).map(x=>[x.id,x]));const states=sc.minimum_information.map(f=>({field:f,...infoState(map.get(f.id))}));const entered=states.filter(x=>x.entered).length,confirmed=states.filter(x=>x.confirmed).length,notApplicable=states.filter(x=>x.notApplicable).length;return {entered,provided:entered,confirmed,notApplicable,total:states.length,missing:states.filter(x=>!x.confirmed&&!x.notApplicable).map(x=>x.field),solverReady:false};}
function csvCell(v){let x=String(v??'');if(/^(?:[\t\r]|\s*[=+\-@])/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"';}
function guideCSV(s){return '\uFEFF'+[['资料名称','需要包含','为什么需要','哪里取得','缺少时怎么办','我的资料或位置','录入情况','业务确认','不适用原因'],...s.minimum_information.map(f=>[f.label,f.fields,f.why_needed,f.where_to_get,f.if_missing,'','未录入','待确认',''])].map(r=>r.map(csvCell).join(',')).join('\r\n');}
function topQuestions(content,d){const sc=content.scenarios.find(s=>s.id===d.scenarioId),brief=d.clientBrief||emptyClientBrief(),missing=infoProgress(content,d).missing;return [0,1,2].map(i=>{const q=brief.questions?.[i]||{},f=missing[i];return {question:nonblank(q.question)?q.question:f?`请确认“${f.label}”：${f.fields}`:['现行做法和系统已能解决哪些环节？','最近一次实际冲突是什么，怎样处理的？','由谁确认目标、边界和最终安排？'][i],owner:nonblank(q.owner)?q.owner:f?(d.information.find(r=>r.id===f.id)?.userSource||'待指定确认人'):'待指定确认人',doneWhen:nonblank(q.doneWhen)?q.doneWhen:f?'取得同一口径资料并由负责人确认':'取得具体答复并记录依据',suggested:!nonblank(q.question)};});}
function briefMarkdown(content,d){const sc=content.scenarios.find(s=>s.id===d.scenarioId),b=d.clientBrief||emptyClientBrief(),v=x=>nonblank(x)?String(x):'待确认',p=infoProgress(content,d);return [`# ${d.title||sc.title}｜${d.mode==='helper'?'客户讨论稿':'工作交接单'}`,'状态：待讨论、未批准、未执行。文字资料不会自动转为计算输入。','## 本次要决定什么',v(d.decisionDescription),'## 不能改变的承诺',v(d.lockedConditions),'## 现行做法与已有工具',`做法：${v(b.currentProcess)}\n工具已能做到：${v(b.existingTools)}`,'## 事实与假设分开',`公开参照（仅背景）：${v(b.publicReference)}`,`客户／业务已确认（请附依据）：${v(b.customerConfirmed)}`,`访谈假设（未证实）：${v(b.hypotheses)}`,'## 优先确认三件事',...topQuestions(content,d).map((q,i)=>`${i+1}. ${q.question}${q.suggested?'【系统建议问题，不是已知事实】':''}\n   找谁：${q.owner}\n   完成条件：${q.doneWhen}`),`## 资料进展\n已录入${p.entered}/${p.total}类；业务确认${p.confirmed}类；声明不适用${p.notApplicable}类。声明不适用不自动豁免计算必填项。`,'## 下一步',d.scenarioId==='WF-F21'?'在本页采购试算中核对结构化字段后计算；不会从叙述自动猜测数量或费用。':'先解决上述关键确认项；当前场景尚未接入求解，不会生成执行安排。'].join('\n\n');}
function draftMarkdown(content,draft){const sc=content.scenarios.find(s=>s.id===draft.scenarioId),v=x=>nonblank(x)?String(x):'待确认';const lines=[briefMarkdown(content,draft),'---','## 附录：完整工作资料',`工作编号：${sc.id}；版本：${content.meta.content_version}`,`已有资料：${v(draft.availableMaterials)}`,`希望改善：${v(draft.goal)}`];for(const f of sc.minimum_information){const r=draft.information.find(x=>x.id===f.id),st=infoState(r);lines.push(`### ${f.label}`,`状态：${st.label}`,`我的内容：${v(r?.userValue)}`,`来源或确认人：${v(r?.userSource)}`,`不适用原因：${st.applicability==='not_applicable'?v(r?.notApplicableReason):'适用'}`,`应包含：${f.fields}`,`为何需要：${f.why_needed}`,`缺少时：${f.if_missing}`);}lines.push('## 保存和证据边界','这是资料与讨论记录；不是已求解、已批准或已执行的方案。企业案例没有自动填入个人任务，没有连接企业系统或发送业务操作。');return lines.join('\n\n');}

(()=>{'use strict';

const APP_VERSION='输入核对改进候选版 v2.3.6-dev.9-candidate';
const e=escapeHtml;
const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',bookmark:'<path d="M6 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17l-6-4-6 4Z"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/>',file:'<path d="M14 3H5v18h14V8Z M14 3v6h5M8 13h8M8 17h6"/>',check:'<path d="m5 12 4 4L19 6"/>',external:'<path d="M14 3h7v7m0-7L10 14M10 5H4v15h15v-6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',back:'<path d="M20 12H5m6-6-6 6 6 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',briefcase:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4M3 12h18m-10-1v3h2v-3"/>',layers:'<path d="m12 3 10 5-10 5L2 8Zm-10 9 10 5 10-5M2 16l10 5 10-5"/>'};
const ico=(name,small=false)=>`<svg class="icon${small?' icon-sm':''}" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.grid}</svg>`;
const dom={main:document.getElementById('main'),header:document.getElementById('header'),modal:document.getElementById('modal'),modalbody:document.getElementById('modalbody'),footer:document.getElementById('footer')};
let db=blankStore(),blocked=false,brokenRaw=null,saveError='',pendingImport=null,toastTimer=null,lastRoute='',renderStep=1;
const ephemeral=new Map(),purchaseCache=new Map();let migrationNotice='';
const view={q:'',industry:'',fn:'',family:'',tab:'industry',savedOnly:false,role:'self',caseCategory:'all',caseQuery:'',legacyQuery:'',archive:false,sort:'value'};
function load(){try{let raw=localStorage.getItem(STORAGE_KEY);const parsed=readStore(raw,C);db=parsed.data;if(parsed.error){blocked=true;brokenRaw=parsed.raw;saveError=parsed.error}}catch{blocked=true;saveError='浏览器不允许此页面保存数据。仍可操作，请及时导出可恢复备份。'}}
function persist(){if(blocked){showSave();return false}try{const s=JSON.stringify(db);if(s.length>3*1024*1024)throw Error('当前本地资料较多');localStorage.setItem(STORAGE_KEY,s);saveError='';showSave();return true}catch{saveError='未能保存到浏览器；当前填写内容仍在页面里，请立即导出备份。';showSave();return false}}
function showSave(){document.querySelectorAll('[data-save-state]').forEach(el=>{const root=el.closest('[data-current-draft]'),d=root?getDraft(root.dataset.currentDraft):null;el.textContent=saveError||(d&&ephemeral.has(d.id)?(hasDraftInput(d)?'当前是未保存的示例／临时任务；需要继续使用请导出备份。':'当前为空白临时表单；首次有效输入后才保存，直接返回不会留下空记录。'):migrationNotice||'已保存在本浏览器；换文件、设备或浏览器前请导出可恢复备份。');el.className=saveError?'saveproblem':'autosave'});const x=document.getElementById('storage-warning');if(x){x.hidden=!saveError;x.textContent=saveError}}
function uid(){return 'd-'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10))}
function toast(msg){clearTimeout(toastTimer);let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.append(el)}el.textContent=msg;toastTimer=setTimeout(()=>el.remove(),3500)}
function download(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function titleFor(d){return d.title.trim()||`未命名 · ${getScenario(C,d.scenarioId).title}`}
function fmtDate(v){const d=new Date(v);return Number.isNaN(+d)?'时间未记录':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
const nav=(href,label,active)=>`<a class="navitem${active?' active':''}" href="${href}">${label}</a>`;
function header(route){const section=route.split('/')[0];dom.header.innerHTML=`<div class="topbar"><a class="brand" href="#/map"><span class="brandmark">${ico('layers')}</span><span>工作有方<small>WORK MAP</small></span></a><nav class="topnav" aria-label="主要导航">${nav('#/map','工作地图',['map','work','draft'].includes(section))}${nav('#/purchase','采购试算',section==='purchase')}${nav('#/cases','真实企业参照',['cases','case'].includes(section))}${nav('#/mine',`我的工作<span class="navcount">${db.drafts.filter(d=>!d.archived).length}</span>`,section==='mine')}</nav><span class="edition">v2.3.6-dev.9-candidate · 采购报价可粘贴</span></div><div class="noticebar">${ico('info',true)}<span>采购可在本页试算；其他39项仍为工作与资料指引。数据不自动联网。<a href="#/about">范围与保存说明</a></span></div>`;dom.footer.innerHTML=`<span>工作有方 · ${e(APP_VERSION)} · 条件内试算，执行需人工确认</span><span><a href="#/legacy">历史84项对应</a>　<a href="#/about">能力与隐私边界</a></span>`;}
function urlMap(){const p=new URLSearchParams();if(view.q)p.set('q',view.q);if(view.industry)p.set('industry',view.industry);if(view.fn)p.set('function',view.fn);if(view.family)p.set('family',view.family);if(view.tab!=='industry')p.set('tab',view.tab);if(view.savedOnly)p.set('saved','1');if(view.sort==='catalog')p.set('sort','catalog');history.replaceState(null,'','#/map'+(p.size?'?'+p:''))}
function bookmarkButton(s){const on=db.bookmarks.includes(s.id);return `<button class="bookmark${on?' on':''}" data-action="bookmark" data-id="${e(s.id)}" aria-label="${on?'取消收藏':'收藏'} ${e(s.title)}" aria-pressed="${on}">${ico('bookmark',true)}</button>`}
function workCard(s,reasons=[]){const f=C.presentation?.featured?.[s.id],show=f&&view.sort==='value'&&!view.q,p=s.candidate_id==='F21';return `<article class="workcard${show?' featuredcard':''}" data-work-id="${e(s.id)}"><div class="cardtop"><span class="familylabel">${e(s.family)} <span class="guidebadge">${p?'可直接试算':show?'建议先看':'资料指引'}</span></span>${bookmarkButton(s)}</div><h3><a href="#/work/${e(s.id)}">${e(s.title)}</a></h3><p class="cardwords">${e(s.user_words)}</p>${show?`<p class="valuepoint"><b>重点看</b>${e(f.question)}</p>`:''}${reasons.length?`<p class="matchreason">匹配到：${e(reasons.join('、'))}；请确认是否是你的工作。</p>`:''}<div class="cardroles">${s.roles.slice(0,3).map(r=>`<span class="chip">${e(r)}</span>`).join('')}</div><p class="cardmeta">${p?'可拿到：采购组合、费用、无解原因与对照':'可拿到：准备单、缺件与确认清单'}</p><div class="cardfoot">${p?'<a class="button primary small" href="#/purchase">开始采购试算</a>':'<span class="small muted">尚未生成执行方案</span>'}<a href="#/work/${e(s.id)}">${p?'查看适用条件':'看看能帮什么'} ${ico('arrow',true)}</a></div></article>`;}

function filteredResults(){return searchWorkMap(C,view.q,{industryId:view.industry,functionId:view.fn,sortMode:view.sort}).filter(r=>(!view.family||r.scenario.family===view.family)&&(!view.savedOnly||db.bookmarks.includes(r.scenario.id)))}
function filtersHtml(){return (view.q?`<button class="chip teal" data-action="removefilter" data-kind="query">问题：${e(view.q)} ×</button>`:'')+[['industry',view.industry,C.industries],['function',view.fn,C.functions]].filter(([,v])=>v).map(([k,id,arr])=>`<button class="chip teal" data-action="removefilter" data-kind="${k}">${e(arr.find(x=>x.id===id)?.label||id)} ×</button>`).join('')+(view.family?`<button class="chip teal" data-action="removefilter" data-kind="family">${e(view.family)} ×</button>`:'')+(view.savedOnly?'<button class="chip teal" data-action="savedfilter">我的收藏 ×</button>':'')+((view.industry||view.fn||view.q||view.family||view.savedOnly)?'<button class="ghost small" data-action="resetfilters">清除全部条件</button>':'');}

function sidebar(){const items=orderedEntries(C,view.tab,view.sort),key=view.tab==='function'?'fn':'industry';return `<aside class="sidepanel" aria-label="行业和职能筛选"><div class="sidetabs" role="group" aria-label="筛选维度"><button data-action="tab" data-tab="industry" class="${view.tab==='industry'?'active':''}" aria-pressed="${view.tab==='industry'}">按行业找</button><button data-action="tab" data-tab="function" class="${view.tab==='function'?'active':''}" aria-pressed="${view.tab==='function'}">按岗位找</button></div><div class="filterlist"><button class="filteritem${!view[key]?' active':''}" data-action="filter" data-kind="${key}" data-id="">${view.tab==='function'?'全部岗位／职能':'全部行业'}<span class="count">40</span></button>${items.map(i=>`<button class="filteritem${view[key]===i.id?' active':''}" data-action="filter" data-kind="${key}" data-id="${e(i.id)}" aria-pressed="${view[key]===i.id}"><span>${e(i.label)}</span><span class="count">${C.scenarios.filter(s=>(view.tab==='function'?s.function_ids:s.industry_ids).includes(i.id)).length}</span></button>`).join('')}</div><div class="sidehint">${view.sort==='value'?'按首次体验价值推荐，非行业规模排名。':'沿用原行业、职能目录顺序。'}<br>行业、岗位与搜索词叠加生效，可分别撤销。<br>右侧数字是关联指引数，不是计算工具数。<br><button class="textbutton small" data-action="order-help">为什么这样排？</button></div></aside>`}
function updateOrderIntro(){const t=document.getElementById('order-intro');if(!t)return;t.innerHTML=`<p>${view.q?'优先匹配工作对象、动作和限制；行业、岗位和问题叠加筛选，可分别撤销。':'采购可以在当前页完成受限试算；其余工作先帮助识别问题和准备资料。推荐顺序不等于已实现计算或已有收益。'}</p><button class="textbutton small" data-action="order-help">排序说明</button>`;}
function orderHelp(){modal('为什么把这些内容放在前面？',`<p>这是面向首次使用者的编辑推荐，不是市场规模、用户热度或效果排名；尚未经过真人点击与完成任务验证。</p><div class="timeline">${C.presentation.criteria.map((v,i)=>`<div><b>${i+1}. ${e(v)}</b></div>`).join('')}</div><p class="note warning section-spacer">展示优先级、研究优先级、当前能否求解分别记录。采购在本页可试算；其余推荐仍为资料指引。当前版未改原站，推荐排序不代表已实现业务收益。</p><p class="sectionintro">行业、职能与工作卡联动排序。选定行业后只推荐相关工作；同时选职能时优先考虑职能。输入问题后相关性优先。可以随时切换回原研究目录顺序。</p>`,`<button class="primary" data-action="close-modal">知道了</button>`);}
function mapPage(params){view.q=params.get('q')||'';view.industry=params.get('industry')||'';view.fn=params.get('function')||'';view.family=params.get('family')||'';view.tab=params.get('tab')==='function'?'function':'industry';view.savedOnly=params.get('saved')==='1';view.sort=params.get('sort')==='catalog'?'catalog':'value';dom.main.innerHTML=`<section class="hero"><div><div class="eyebrow">从你熟悉的工作出发</div><h1>找到你工作中值得优化的安排</h1><p>先找到你要作的决定。采购可直接算出数量与费用；<br>其他工作帮助看清规则、资料和需要确认的问题。</p><a class="button primary section-spacer" href="#/purchase">直接算一份采购方案 ${ico('arrow',true)}</a></div><div class="herosteps" aria-label="使用步骤"><div class="herostep"><span>01</span>找到与自己有关的问题</div><div class="herostep"><span>02</span>看清要提供哪些信息</div><div class="herostep"><span>03</span>准备自己的工作资料</div></div></section><form class="searchbox" id="search-form" role="search">${ico('search')}<label for="work-search" class="sr-only">描述你遇到的工作问题</label><input id="work-search" maxlength="500" value="${e(view.q)}" placeholder="说说你遇到的问题，例如：员工请假怎么调班、仓里有货门店缺货" autocomplete="off"><button class="primary" type="submit">查找相关工作</button></form><div class="searchhelp"><span>试着搜索</span>${['三家供应商怎么买','几个项目抢专家','仓里有货门店缺货','售后上门怎么派','临时请假跨店支援','材料不够先保哪些订单'].map(q=>`<button type="button" class="quick" data-action="quicksearch" data-query="${e(q)}">${e(q)}</button>`).join('')}</div><div class="maplayout">${sidebar()}<section aria-label="工作场景"><div class="resultsheader"><div><h2 id="result-heading">从一段具体工作开始</h2><p class="resultsub" id="result-count" aria-live="polite"></p></div><div class="mapcontrols"><select class="select-small" id="order-mode" aria-label="展示排序"><option value="value" ${view.sort==='value'?'selected':''}>首次体验优先</option><option value="catalog" ${view.sort==='catalog'?'selected':''}>原研究目录顺序</option></select><select class="select-small" id="family-filter" aria-label="按工作类型筛选"><option value="">所有工作类型</option>${C.work_families.map(x=>`<option value="${e(x)}" ${view.family===x?'selected':''}>${e(x)}</option>`).join('')}</select></div></div><div id="order-intro" class="orderintro"></div><div id="activefilters" class="activefilters"></div><div id="results"></div><p class="gridfoot">40项工作中，单品采购已接通当前页面计算；其余39项仍提供问题识别和准备指引。</p></section></div>`;renderResults();}
function caseLinks(s){const a=C.cases.filter(c=>c.guide_ids.includes(s.id));return a.length?`<div class="references">${a.map(c=>`<article class="reference"><h3>${e(c.company)} <span class="chip ${c.category==='feishu_public'?'teal':''}">${c.category==='feishu_public'?'飞书公开客户':'同类真实企业'}</span></h3><p>${e(c.title)}</p><a class="small" href="#/case/${e(c.id)}">查看公开背景与相关工作 ${ico('arrow',true)}</a></article>`).join('')}</div>`:'<p class="muted small">此项已有工作指引；尚未整理与它直接对应的具名企业案例。不要把类比背景当成真实需求。</p>'}
function sourceRows(ids){return ids.map(id=>{const x=C.sources.find(s=>s['证据ID']===id);return x?`<div class="sourceitem"><strong>${e(x['标题'])}</strong><div>${e(x['原文时间说明'])} · 材料日期口径沿用上一轮研究</div><div>${e(x['可支持内容与限制'])}</div>${safeLink(x['来源URL'])?`<a href="${e(safeLink(x['来源URL']))}" target="_blank" rel="noopener noreferrer">查看原始来源 ${ico('external',true)}</a>`:''}</div>`:''}).join('')}
function infoDetail(f,i,open=false){return `<details class="infodetail" ${open?'open':''}><summary><span class="infonum">${String(i+1).padStart(2,'0')}</span><span class="summarybody"><strong>${e(f.label)}</strong><span>${e(f.fields)}</span></span></summary><div class="infobody"><div class="inforow"><strong>为什么需要</strong><span>${e(f.why_needed)}</span></div><div class="inforow"><strong>去哪里取得</strong><span>${e(f.where_to_get)}</span></div><div class="inforow warn"><strong>暂时没有？</strong><span>${e(f.if_missing)}</span></div></div></details>`}
function workPage(id){let s;try{s=getScenario(C,id)}catch{return missingPage()}const n=C.cases.filter(c=>c.guide_ids.includes(s.id)).length;dom.main.innerHTML=`<div class="breadcrumb"><a href="#/map">工作地图</a>${ico('chevron',true)}<span>${e(s.family)}</span>${ico('chevron',true)}<span>${e(s.candidate_id)}</span></div><div class="detailtop"><div><div class="chips"><span class="chip teal">工作使用指引</span><span class="chip">${s.candidate_id==='F21'?'本页可做受限采购试算':'当前可准备资料'}</span></div><h1>${e(s.title)}</h1><div class="chips">${s.roles.map(r=>`<span class="chip">${e(r)}</span>`).join('')}</div></div>${bookmarkButton(s)}</div><div class="viewtoggle">使用视角 <select id="perspective" aria-label="选择使用视角"><option value="self" ${view.role==='self'?'selected':''}>处理我自己的工作</option><option value="helper" ${view.role==='helper'?'selected':''}>帮客户找优化机会</option></select></div>${view.role==='helper'?'<div class="note section-spacer" style="margin:12px 0 20px">先用公开案例理解工作，再向客户确认：当前怎样做、现有工具解决到哪一步、哪些条件和资料已经可靠。案例背景不能替代客户这一次的实际信息。</div>':''}<div class="detailgrid"><div><section class="panel"><h2>你遇到的，是不是这样的事？</h2><p class="quote">${e(s.user_words)}</p><div class="definition"><b>工作台帮你理清的决定</b>${e(s.decision)}</div></section><section class="panel" id="information"><div class="sectiontop"><h2>先准备哪些信息</h2><button class="ghost small" data-action="download-template" data-id="${e(s.id)}">${ico('download',true)}下载资料清单</button></div><p class="sectionintro">优先使用手头已有的表格或记录。展开一项，看看为什么需要、去哪找；未知的信息可以先留空。</p>${s.minimum_information.map((f,i)=>infoDetail(f,i,i===0)).join('')}</section><section class="panel"><h2>这一步能得到什么</h2><div class="twofields"><div class="softbox teal"><h3>现在可以得到</h3><p>${s.candidate_id==='F21'?'单品三供应商的采购分配、费用核算、不可行原因和基准对照；另可准备资料。':'你自己的工作准备单、必要资料清单和待确认事项，可保存、修改和导出。'}</p></div><div class="softbox"><h3>${s.candidate_id==='F21'?'本版采购范围':'接通并验证计算后，目标是'}</h3><p>${s.candidate_id==='F21'?'单品、三家供应商、1—500整数需求；当前页可算。未覆盖的业务规则须先确认，不静默忽略。':e(s.target_output)+'。此场景尚未求解。'}</p></div></div><p class="note section-spacer">${e(s.recognition.not_fit)}</p></section><section class="panel"><h2>真实企业工作，作为参照</h2><p class="sectionintro">帮助你认识工作形态。不需要扮演这家企业的员工，也不会把案例事实填进你的任务。</p>${caseLinks(s)}</section><details class="panel"><summary class="textbutton">查看来源、适用边界与旧目录对应</summary><p class="note section-spacer">公开业务背景、我们设计的工作指引、你提供的信息和工具运行能力，是四类不同内容。${e(s.source_scope)}</p>${sourceRows(s.background_source_ids)}<div class="section-spacer small muted">旧目录对应：${s.legacy_scene_ids.map(x=>`<a href="#/legacy?focus=${e(x)}">${e(x)}</a>`).join(' · ')||'暂无直接对应'}。只建立关联，不自动改变旧底稿归属。</div></details></div><aside class="rail"><div class="actionpanel"><h3>开始你自己的这次工作</h3>${s.candidate_id==='F21'?'<a class="button primary block section-spacer" href="#/purchase">直接输入报价并试算</a>':''}<p>先说清三件事：要决定什么、什么不能改、手头有什么资料。不用一次填完。</p><button class="primary block" data-action="start-draft" data-id="${e(s.id)}">准备我的资料 ${ico('arrow',true)}</button><div class="small">空白开始 · 不带入企业案例数据</div></div><div class="panel"><h3>有些信息还不知道？</h3><p>可以先保存已知内容，导出缺件清单，再向对应负责人确认。空白不会被当成0，也不会替你猜数值。</p></div>${s.candidate_id==='F21'?`<div class="panel"><h3>在本页完成采购决定</h3><p>单品、三家供应商、1—500件整数需求；起订、上限、交期、费用、最低承诺和精确锁量分别核对。</p><a class="button outline block small section-spacer" href="#/purchase">开始采购试算</a></div>`:''}<div class="panel"><h3>${n}条相关真实企业参照</h3><p>案例是理解工作的参照，不是本工作台的客户背书或改进收益证明。</p></div></aside></div>`;}
function casesPage(){const rows=C.cases.filter(c=>(view.caseCategory==='all'||c.category===view.caseCategory)&&(!view.caseQuery||[c.company,c.title,c.public_facts].join(' ').includes(view.caseQuery)));dom.main.innerHTML=`<div class="pageintro"><div class="eyebrow">真实工作 · 对照理解</div><h1>看看这些企业在处理什么工作</h1><p>公开案例帮助你理解业务形态和现有做法。找到相似的工作后，用你自己的任务继续；不需要扮演企业员工，也不会带入案例中的人数、费用或条件。</p></div><div class="pills"><button data-action="casecategory" data-id="all" class="${view.caseCategory==='all'?'active':''}">全部参照 · 19</button><button data-action="casecategory" data-id="feishu_public" class="${view.caseCategory==='feishu_public'?'active':''}">飞书已公开客户案例 · 12</button><button data-action="casecategory" data-id="profile_match_real" class="${view.caseCategory==='profile_match_real'?'active':''}">与画像匹配的其他真实企业 · 7</button></div><div class="casegrid">${rows.map(c=>`<article class="casecard"><div class="companymark" aria-hidden="true">${e(c.company.slice(0,1))}</div><div class="small muted">${c.category==='feishu_public'?'飞书公开客户案例':'其他真实企业案例'}</div><h2>${e(c.company)}</h2><p class="casetitle">${e(c.title)}</p><div class="small muted">可对照 ${c.guide_ids.length} 项工作指引</div><a class="button" href="#/case/${e(c.id)}">看看我的工作是否类似 ${ico('arrow',true)}</a></article>`).join('')}</div><div class="note section-spacer">案例事实继承上一轮研究材料和原始来源。本次更新没有重新逐页核验企业现状；公开材料中的历史困难不等于企业今天仍然存在同样的困难。</div>`;}
function casePage(id){const c=C.cases.find(x=>x.id===id);if(!c)return missingPage();dom.main.innerHTML=`<div class="casebody"><div class="breadcrumb"><a href="#/cases">真实企业参照</a>${ico('chevron',true)}${e(c.company)}</div><div class="pageintro"><span class="chip teal">${c.category==='feishu_public'?'飞书已公开客户案例':'与画像匹配的其他真实企业案例'}</span><h1 style="margin-top:12px">${e(c.company)}</h1><p>${e(c.title)}</p></div><section class="panel"><h2>公开材料讲了什么</h2><p class="lead">${e(c.public_facts)}</p><p class="note section-spacer">时间口径：${e(c.source_time)}。${e(c.case_limit)}</p></section><section class="panel"><h2>可以从中看懂什么</h2><p>${e(c.what_to_notice)}</p>${c.hypotheses?`<div class="note warning section-spacer"><b>待访谈假设，不是已披露事实</b><br>${e(c.hypotheses)}</div>`:''}<p class="sectionintro">下面是基于业务背景设计的工作指引，并非企业向本平台提出的具体需求。</p><div class="references">${c.guide_ids.map(id=>{const s=getScenario(C,id);return `<article class="reference"><h3>${e(s.title)}</h3><p>${e(s.user_words)}</p><a href="#/work/${e(s.id)}" class="button outline small">看看这类问题需要什么信息 ${ico('arrow',true)}</a></article>`}).join('')}</div></section><section class="panel"><h2>来源和证据范围</h2><p class="small muted">${e(c.source_review)}</p>${c.source_urls.map((u,i)=>`<div class="sourceitem"><a href="${e(safeLink(u)||'#')}" target="_blank" rel="noopener noreferrer">查看公开来源${c.source_urls.length>1?' '+(i+1):''} ${ico('external',true)}</a><div class="small soft">${e(u)}</div></div>`).join('')}<div class="note section-spacer">新建个人工作时，不会自动填写公司身份、数量、约束或收益。你可以直接选择工作指引，开始自己的任务。</div></section></div>`;}
function startDraft(id){const d=newWork(id,view.role);if(d)location.hash=`#/draft/${d.id}/1`;}
function getDraft(id){return db.drafts.find(d=>d.id===id)||ephemeral.get(id);}
function draftHeading(d,s,step){return `<div class="breadcrumb"><a href="#/work/${e(s.id)}">${e(s.title)}</a>${ico('chevron',true)}<span>我的工作准备</span></div><div class="pageintro"><div class="eyebrow">用自己的任务继续 · 不带入案例数据</div><h1>${step===1?'先说清这次要做什么':step===2?'对照资料清单，补上已知内容':'这份工作，下一步怎么继续'}</h1><p>${step===1?'只需先回答下面三个问题。暂时不清楚的可以留空，不用一次填完。':step===2?'先用已有资料，缺少的标为待补充。填写情况只反映准备进度，不代表事实已核验或已能求解。':(s.candidate_id==='F21'?'保存问题与条件，或在同一记录继续采购结构化试算。':'保存问题、已知条件和待确认项，方便下一位同事接手；本场景尚未接入求解。')}</p></div><nav class="stepbar" aria-label="工作准备步骤">${[[1,'描述这次工作'],[2,'准备必要资料'],[3,'查看准备单']].map(([n,label])=>`<a href="#/draft/${e(d.id)}/${n}" class="step${n===step?' active':''}" ${n===step?'aria-current="step"':''}><span>${n}</span>${label}</a>`).join('')}</nav>`}
function statusSelect(row){const st=infoState(row);return `<div class="status-controls"><span class="chip ${st.entered?'teal':''}" data-info-state="${e(row.id)}">${e(st.label)}</span><label class="small">业务确认 <select data-info-id="${e(row.id)}" data-info-field="confirmation" aria-label="${e(row.id)}业务确认" ${!st.entered||st.applicability==='not_applicable'?'disabled':''}><option value="pending" ${st.confirmation==='pending'?'selected':''}>待确认</option><option value="confirmed" ${st.confirmation==='confirmed'?'selected':''}>已由业务确认</option><option value="conflict" ${st.confirmation==='conflict'?'selected':''}>存在冲突</option></select></label><label class="small">本任务适用性 <select data-info-id="${e(row.id)}" data-info-field="applicability" aria-label="${e(row.id)}适用性"><option value="applicable" ${st.applicability==='applicable'?'selected':''}>适用</option><option value="not_applicable" ${st.applicability==='not_applicable'?'selected':''}>不适用（须说明）</option></select></label></div>`;}
function draftPage(id,step){const d=getDraft(id);if(!d)return missingPage('这份工作不在本预览的存档中。原站底稿没有被自动迁移。');const s=getScenario(C,d.scenarioId);step=[1,2,3].includes(step)?step:1;renderStep=step;dom.main.innerHTML=`<div class="wizard" data-current-draft="${e(d.id)}">${draftHeading(d,s,step)}${step===1?draftOne(d,s)+clientBriefForm(d):step===2?draftTwo(d,s):draftThree(d,s)}<div data-save-state class="autosave"></div></div>`;showSave();}
function draftOne(d,s){return `<div class="formgrid"><section class="panel"><div class="field"><label for="decision">1. 这次要决定什么？</label><p class="hint">${e(s.initial_questions[0])}</p><textarea id="decision" data-draft-field="decisionDescription" maxlength="20000" placeholder="${e(s.user_words)}">${e(d.decisionDescription)}</textarea></div><div class="field"><label for="locked">2. 哪些安排已经确定，不能改？</label><p class="hint">例如已承诺的时间、预留给其他任务的资源。这里仅是提示，不会被当成你的实际条件。</p><textarea id="locked" data-draft-field="lockedConditions" maxlength="20000" placeholder="写下已经确定的安排；不清楚的可写“待确认”">${e(d.lockedConditions)}</textarea></div><div class="field"><label for="materials">3. 手头已有哪份资料？</label><p class="hint">可以粘贴文字，或写表格名称、所在系统和提供人。本页未接入业务文件解析，不会读取你写出的文件路径。</p><textarea id="materials" data-draft-field="availableMaterials" maxlength="20000" placeholder="例如：已有一份要货表和库存导出，还没问到运输时间">${e(d.availableMaterials)}</textarea></div><div class="formactions"><a class="button" href="#/work/${e(s.id)}">返回指引</a><a class="button primary" href="#/draft/${e(d.id)}/2">查看需要补充的信息 ${ico('arrow',true)}</a></div></section><aside class="rail"><div class="panel"><h3>这次工作对应的决定</h3><p>${e(s.decision)}</p></div><div class="panel"><h3>不用先凑齐全部资料</h3><p>先写手头知道的内容。下一步会说明每项资料为什么需要、找谁确认，以及缺少时如何继续。</p></div><div class="note">你填写的内容只保存在这个预览的本地存档。它不读取或覆盖原网站底稿。空白表单在第一次有效输入前不会保存。</div></aside></div>`}
function draftTwo(d,s){const p=infoProgress(C,d);return `<section class="panel"><div class="twofields"><div class="field"><label for="draft-title">给这次工作起个名字</label><input id="draft-title" data-draft-field="title" maxlength="300" value="${e(d.title)}" placeholder="例如：下周门店要货安排"></div><div class="field"><label for="draft-goal">希望优先改善什么？</label><input id="draft-goal" data-draft-field="goal" maxlength="20000" value="${e(d.goal)}" placeholder="由业务负责人确认"></div></div><div class="progressline"><span>录入与确认分别计算</span><span id="provided-count">已录入 ${p.entered}/${p.total} 类 · 业务确认 ${p.confirmed} 类</span></div><div class="progress"><i id="provided-bar" style="width:${p.entered/p.total*100}%"></i></div><p class="small muted">录入内容不会自动变成已确认事实。不适用必须说明原因，且不会豁免采购试算的必填条件。</p>${s.minimum_information.map((f,i)=>{const row=d.information.find(x=>x.id===f.id);return `<section class="dataentry"><div class="dataentryhead"><h3>${i+1}. ${e(f.label)}</h3></div>${statusSelect(row)}<p class="small muted">应包含：${e(f.fields)}</p><details class="infodetail"><summary><span class="summarybody"><strong>为什么需要、去哪取得、缺少怎么办？</strong></span></summary><div class="infobody">${e(f.why_needed)}<br>${e(f.where_to_get)}<br>${e(f.if_missing)}</div></details><div class="field"><label for="v-${e(f.id)}">我的资料或待确认内容</label><textarea id="v-${e(f.id)}" maxlength="20000" data-info-id="${e(f.id)}" data-info-field="userValue">${e(row.userValue)}</textarea></div><div class="twofields"><div class="field"><label for="s-${e(f.id)}">来源／确认人</label><input id="s-${e(f.id)}" data-info-id="${e(f.id)}" data-info-field="userSource" maxlength="20000" value="${e(row.userSource)}"></div><div class="field"><label for="na-${e(f.id)}">不适用原因（仅不适用时填写）</label><input id="na-${e(f.id)}" data-info-id="${e(f.id)}" data-info-field="notApplicableReason" maxlength="20000" value="${e(row.notApplicableReason)}"></div></div></section>`}).join('')}<div class="formactions section-spacer"><a class="button" href="#/draft/${e(d.id)}/1">上一步</a><a class="button primary" href="#/draft/${e(d.id)}/3">查看交接单</a></div></section>`;}
function draftThree(d,s){const p=infoProgress(C,d),val=v=>nonblank(v)?e(v):'待确认';return `<div class="formgrid"><div><section class="panel"><div class="sectiontop"><h2>${e(d.title||s.title)}</h2><span class="chip amber">待讨论 · 未批准、未执行</span></div><div class="summaryrow"><b>这次决定</b><div class="prewrap">${val(d.decisionDescription)}</div></div><div class="summaryrow"><b>不可改变的条件</b><div class="prewrap">${val(d.lockedConditions)}</div></div><div class="twofields"><div class="summaryrow"><b>现行做法</b><div class="prewrap">${val(d.clientBrief?.currentProcess)}</div></div><div class="summaryrow"><b>已有工具做到哪一步</b><div class="prewrap">${val(d.clientBrief?.existingTools)}</div></div></div></section><section class="panel"><h2>最先确认三件事</h2>${topQuestions(C,d).map((q,i)=>`<div class="summaryrow"><b>${i+1}. ${q.suggested?'建议提问（尚未取得答复）':'本次待问问题'}</b><p>${e(q.question)}</p><p class="small muted">找谁：${e(q.owner)}<br>完成条件：${e(q.doneWhen)}</p></div>`).join('')}</section><section class="panel"><h2>事实与假设分开</h2>${[['公开参照，仅作背景',d.clientBrief?.publicReference],['业务已确认，请保留依据',d.clientBrief?.customerConfirmed],['访谈假设，尚未证实',d.clientBrief?.hypotheses]].map(([t,v])=>`<div class="summaryrow"><b>${t}</b><div class="prewrap">${val(v)}</div></div>`).join('')}</section><section class="panel"><h2>资料状态与明细</h2><div class="readinesscount">已录入 ${p.entered}/${p.total} 类 · 业务确认 ${p.confirmed} 类 · 声明不适用 ${p.notApplicable} 类</div>${s.minimum_information.map(f=>{const r=d.information.find(x=>x.id===f.id);return `<details class="infodetail"><summary><span class="summarybody"><strong>${e(f.label)}</strong><span>${e(infoState(r).label)}</span></span></summary><div class="infobody"><div class="prewrap">${val(r.userValue)}</div><p>来源／确认人：${val(r.userSource)}</p>${r.applicability==='not_applicable'?`<p>不适用原因：${val(r.notApplicableReason)}</p>`:''}</div></details>`}).join('')}<p class="note section-spacer">进度只反映资料状态；不能证明内容真实、完整或已得到业务方案。</p></section></div><aside class="rail"><div class="actionpanel"><h3>交给下一位处理人</h3><p>简明稿突出决定、现行做法和三个待问问题；完整稿附全部资料。备份用于恢复编辑。</p><button class="primary block" data-action="export-brief" data-id="${e(d.id)}">导出简明讨论稿</button><button class="button block section-spacer" data-action="export-draft-txt" data-id="${e(d.id)}">导出完整准备单</button><button class="button block section-spacer" data-action="export-draft-json" data-id="${e(d.id)}">下载可恢复备份（JSON）</button></div><a class="button block" href="#/draft/${e(d.id)}/1">补充讨论信息</a><a class="button block section-spacer" href="#/draft/${e(d.id)}/2">修改资料</a>${s.candidate_id==='F21'?`<a class="button primary block section-spacer" href="#/purchase/${e(d.id)}">用这份任务继续采购试算</a><p class="small muted section-spacer">同一记录接续；文字原样保留，结构化数量与报价由你核对录入，不自动猜数。</p>`:'<p class="small muted section-spacer">此场景尚未接入计算，当前交付是准备和讨论材料。</p>'}</aside></div>`;}
function minePage(){const drafts=db.drafts.filter(d=>view.archive||!d.archived);dom.main.innerHTML=`<div class="pageintro"><div class="eyebrow">保留投入 · 下次继续</div><h1>我的工作</h1><p>这里保存已录入内容的工作准备单与采购试算。不会自动读取或迁移原站内容；旧备份可以先只读查看并原样带走。</p></div><div class="exporttools"><a class="button primary" href="#/map">${ico('grid',true)}找到一项工作</a><button data-action="export-all">${ico('download',true)}备份全部工作（JSON）</button><label class="filelabel">${ico('file',true)}导入备份<input class="sr-only" type="file" id="import-file" accept=".json,application/json"></label><button class="ghost" data-action="toggle-archive">${view.archive?'隐藏归档':'查看归档'}</button></div><div class="mystats"><div class="stat"><b>${db.drafts.filter(d=>!d.archived).length}</b><span>已保存的工作</span></div><div class="stat"><b>${db.bookmarks.length}</b><span>收藏的工作指引</span></div><div class="stat"><b>${db.legacyBackups.length}</b><span>只读历史备份</span></div></div><div id="storage-warning" class="saveproblem" ${saveError?'':'hidden'}>${e(saveError)}</div>${brokenRaw?'<button class="outline section-spacer" data-action="export-broken">导出受保护的原始存档</button>':''}<section class="worklist">${drafts.length?drafts.map(d=>{const s=getScenario(C,d.scenarioId),p=infoProgress(C,d);return `<article class="draftcard"><div><h3>${e(titleFor(d))}${d.archived?' <span class="chip">已归档</span>':''}</h3><p>${e(s.family)} · ${d.purchase?'采购试算输入':`已录入${p.entered}/${p.total}类 · 业务确认${p.confirmed}类`} · ${e(fmtDate(d.updatedAt))}</p></div><div class="actions"><a class="button primary small" href="${d.purchase?`#/purchase/${e(d.id)}`:`#/draft/${e(d.id)}/1`}">${d.purchase?'继续试算':'继续填写'}</a><button class="small" data-action="export-draft-txt" data-id="${e(d.id)}">导出</button><button class="ghost small" data-action="archive" data-id="${e(d.id)}">${d.archived?'恢复':'归档'}</button></div></article>`}).join(''):`<div class="empty"><h3>从你手头的一次工作开始</h3><p>找到适用的指引后，点击“准备我的资料”。不用先填完整企业画像。</p><a class="button primary" href="#/map">去工作地图</a></div>`}</section>${db.bookmarks.length?`<section class="section-spacer"><div class="sectiontop"><h2>我收藏的工作</h2><a href="#/map?saved=1" class="small">查看全部收藏</a></div><div class="pills" style="margin-top:12px">${db.bookmarks.map(id=>{const s=getScenario(C,id);return `<a class="button" href="#/work/${e(id)}">${e(s.title)}</a>`}).join('')}</div></section>`:''}${db.legacyBackups.length?`<section class="section-spacer"><h2>只读历史备份</h2><p class="sectionintro">无法核对原站存储结构，因此未转换、未覆盖、未改为个人业务事实。原文件可以原样导出。</p><div class="worklist">${db.legacyBackups.map(x=>`<article class="draftcard"><div><h3>${e(x.name)}</h3><p>原样保留 · 未迁移 · ${e(fmtDate(x.importedAt))}</p></div><div class="actions"><button data-action="view-legacy-backup" data-id="${e(x.id)}">只读查看</button><button data-action="export-legacy-backup" data-id="${e(x.id)}">原样导出</button></div></article>`).join('')}</div></section>`:''}<div class="note section-spacer">浏览器本地存档可能受文件位置、浏览器隐私模式和空间限制影响。它不是云同步，也不是多人协作存储；重要内容请导出备份。</div>`;}
function legacyPage(params){const focus=params.get('focus')||'';view.legacyQuery=params.get('q')||view.legacyQuery;dom.main.innerHTML=`<div class="pageintro"><div class="eyebrow">84项历史工作目录 · 原编号保留</div><h1>旧内容仍有去处</h1><p>54项历史内容与新指引建立了关联，另30项保留在历史目录。多对多关联不会把一份旧底稿自动改到另一个场景。本页展示的是原目录材料，不代表原站存储已完成迁移。</p></div><div class="searchbox">${ico('search')}<input id="legacy-search" aria-label="查找历史工作" value="${e(view.legacyQuery)}" placeholder="输入旧编号，例如 S054；或工作名称" maxlength="200"><button data-action="legacy-reset">清除</button></div><div class="legacylist" id="legacy-results"></div>`;renderLegacy(focus);if(focus)setTimeout(()=>document.getElementById('old-'+focus)?.scrollIntoView({block:'center'}),0)}
function renderLegacy(focus=''){const q=view.legacyQuery.toLowerCase();const rows=L.scenarios.filter(s=>!q||[s.id,s.scenario_name,s.user_words,s.function_name].join(' ').toLowerCase().includes(q));document.getElementById('legacy-results').innerHTML=rows.length?rows.map(s=>{const m=C.legacy_mappings.find(x=>x.legacy_id===s.id);return `<article class="legacyrow" id="old-${e(s.id)}" ${focus===s.id?'style="border-color:#75aa98"':''}><span class="legacyid">${e(s.id)}</span><div><h3>${e(s.scenario_name)}</h3><p>${e(s.user_words)}</p><div class="pills">${m.new_scene_ids.map(id=>`<a class="button outline" href="#/work/${e(id)}">新指引：${e(getScenario(C,id).title)}</a>`).join('')||'<span class="chip">不在本轮重点，内容仍保留</span>'}</div><details style="margin-top:12px"><summary>查看原目录要求</summary><div class="note" style="margin-top:10px">要决定：${e(s.decision)}<br>最低资料：${e(s.min_data.join('；'))}<br>需要核对：${e(s.hard_rules.join('；'))}<br>原目录中的输出是候选成果，不是本预览已生成的结果。</div></details></div></article>`}).join(''):'<div class="empty"><h3>未找到对应的旧编号或工作</h3><p>原84项内容均在本页，可清除条件继续浏览。</p></div>';}
function aboutPage(){dom.main.innerHTML=`<div class="singlecolumn"><div class="pageintro"><div class="eyebrow">工作有方 v2.3.6-dev.9-candidate · 私有预览</div><h1>一项可计算的决定，保留完整工作地图</h1><p>采购说明与简表可在浏览器整理为核对卡，确认后调用既有求解器。原在线站点、账号权限和原站数据没有修改。</p></div><section class="panel"><h2>采购计算的边界</h2><p>单品、三家供应商、1—500整数需求；同规格、同单位、同税费币种；单价加一次下单固定费；按确认到货日、起订量、供货上限、最低承诺、精确锁量和预算求最低总费用。</p><p class="note section-spacer">穷举的是本模型内的允许组合；不能证明未录入的业务条件正确。不支持阶梯报价、分批交货、多品类、随机交期、自动下单或付款。</p><a class="button primary section-spacer" href="#/purchase">打开采购试算</a></section><section class="panel"><h2>其余能力</h2><p>保留14行业、12职能、40项工作、19条企业参照和84条历史对应。其他39项仍是问题识别与资料准备，不生成班表、路线或调拨方案。</p><p class="sectionintro">搜索使用业务词典和显式规则，没有调用大模型。工作搜索只用文字定位场景。进入采购页后，可主动粘贴采购说明或报价表，按规则整理并确认字段。填写文件路径不会读取文件。</p></section><section class="panel"><h2>保存、恢复与隐私</h2><p>业务资料仅保存在当前浏览器；无联网API、埋点或自动上传。此版使用独立存档。旧版记录可从JSON备份导入为副本。换文件位置、浏览器或设备，不能保证自动找到旧存档，请导出和导入JSON备份。</p><p class="sectionintro">v2.1备份可导入为新副本；原文件另以只读形式留存。采购结果不从备份直接采信：恢复时使用输入重新计算。存储被禁用或空间不足时明确告警。</p></section><section class="panel"><h2>仍待独立验证</h2><p>真人能否独立完成、真实客户是否重复使用、总时间是否下降、实际收益与付费均未验证。开发自检不等于红队验收。案例材料继承既有研究，汉得表述依据所提供红队意见收紧，未新增企业现状调查。</p></section></div>`;}
function missingPage(text='没有找到这条工作记录。'){dom.main.innerHTML=`<div class="empty"><h2>这个入口暂时无法打开</h2><p>${e(text)}</p><a class="button primary" href="#/map">返回工作地图</a></div>`}
function modal(title,body,actions=''){dom.modalbody.innerHTML=`<div class="modalhead"><h2>${e(title)}</h2><button class="ghost" data-action="close-modal" aria-label="关闭">${ico('close')}</button></div>${body}<div class="modalfoot">${actions||'<button data-action="close-modal">关闭</button>'}</div>`;dom.modal.showModal();}
function originalDialog(){modal('原站保留，尚未替换',`<p>你将打开原来的私有「工作有方」。它可能要求使用原账号登录。</p><div class="note section-spacer">进入后选择“采购试算”。本预览没有验证其当前路由和最新运行状态，也不会自动传送你填写的数据。</div>`,`<button data-action="close-modal">取消</button><a class="button primary" href="${e(C.meta.target_site)}" target="_blank" rel="noopener noreferrer">打开原站 ${ico('external',true)}</a>`);}
function draftExport(d,json=false){if(!d)return;const name=(d.title||getScenario(C,d.scenarioId).title).replace(/[\\/:*?"<>|]/g,'_').slice(0,70);if(json)download(name+'_准备备份.json',JSON.stringify({kind:BACKUP_KIND,version:3,exportedAt:new Date().toISOString(),drafts:[d]},null,2),'application/json;charset=utf-8');else download(name+'_工作准备单.txt',draftMarkdown(C,d));}
function updateInput(el){const root=document.querySelector('[data-current-draft]');if(!root)return;const d=getDraft(root.dataset.currentDraft);if(!d)return;if(el.dataset.purchaseField||el.dataset.supplierField){purchaseInput(el,d);return;}if(el.dataset.draftField){const k=el.dataset.draftField;if(!['title','decisionDescription','lockedConditions','availableMaterials','goal','mode'].includes(k))return;d[k]=k==='mode'?(el.value==='helper'?'helper':'self'):el.value;}else if(el.dataset.clientField){d.clientBrief=d.clientBrief||emptyClientBrief();d.clientBrief[el.dataset.clientField]=el.value;}else if(el.dataset.questionIndex!==undefined){d.clientBrief=d.clientBrief||emptyClientBrief();d.clientBrief.questions[Number(el.dataset.questionIndex)][el.dataset.questionField]=el.value;}else if(el.dataset.infoId){const row=d.information.find(x=>x.id===el.dataset.infoId),k=el.dataset.infoField;if(!row||!['userValue','userSource','confirmation','applicability','notApplicableReason'].includes(k))return;if(k==='confirmation'&&(!nonblank(row.userValue)||row.applicability==='not_applicable')){row.confirmation='pending';el.value='pending';toast('没有录入资料，不能标为业务已确认。');return;}row[k]=el.value;if(k==='userValue'||k==='userSource')row.confirmation='pending';}else return;d.updatedAt=new Date().toISOString();commitWork(d);const p=infoProgress(C,d);const c=document.getElementById('provided-count'),bar=document.getElementById('provided-bar');if(c)c.textContent=`已录入 ${p.entered}/${p.total} 类 · 业务确认 ${p.confirmed} 类 · 不适用 ${p.notApplicable} 类`;if(bar)bar.style.width=`${p.entered/p.total*100}%`;for(const row of d.information){const st=infoState(row);document.querySelectorAll('[data-info-state]').forEach(x=>{if(x.dataset.infoState===row.id){x.textContent=st.label;x.classList.toggle('teal',st.entered);}});document.querySelectorAll('[data-info-field="confirmation"]').forEach(x=>{if(x.dataset.infoId===row.id){x.disabled=!st.entered||st.applicability==='not_applicable';x.value=st.confirmation;}});}showSave();}
async function importFile(file){if(!file)return;if(file.size>MAX_FILE_BYTES)return toast('备份超过1 MB，未导入，也没有改变已有工作。');try{const raw=await file.text(),result=parseImport(raw,C);pendingImport={...result,name:file.name,raw};if(result.type==='drafts'){modal('导入前先确认',`<p>识别到 ${result.count} 份新版个人工作。确认后添加为新副本，不会覆盖已有记录。</p><div class="modalpre">${e(result.drafts.map(d=>`${d.title||'未命名'} · ${getScenario(C,d.scenarioId).title}`).join('\n'))}</div><p>数据由备份提供，未核验真实性；采购输入恢复后在进入试算页时重新核验并重算，不采信备份附带结果。</p>`,`<button data-action="cancel-import">取消，保留当前工作</button><button class="primary" data-action="confirm-import">添加为新副本</button>`)}else{modal('旧版或其他结构：先只读查看',`<p>无法确认它与原站存储结构的兼容性。本页不会自动转换、改名或覆盖；可原样保存在只读备份区。</p><div class="modalpre">${e(raw.slice(0,4000))}${raw.length>4000?'\n… 此处仅预览前4000字，保存时完整保留原文件。':''}</div>`,`<button data-action="cancel-import">取消</button><button class="primary" data-action="confirm-import">保存为只读备份</button>`)}
 }catch(err){pendingImport=null;modal('没有导入',`<p>${e(err.message)}</p><div class="note section-spacer">已有底稿、收藏和历史备份均保持原样。</div>`);}}
function confirmImport(){if(!pendingImport)return;const p=pendingImport;if(p.type==='drafts'&&db.drafts.length+p.count>200)return toast('记录数将超过200份，未导入。');if((p.type==='legacy'||p.preserveOriginal)&&db.legacyBackups.length>=30)return toast('历史备份区已满，为保护原文件本次未导入。');if(p.type==='drafts'){const incoming=p.drafts.map(item=>({...item,id:uid(),updatedAt:new Date().toISOString(),createdAt:item.createdAt||new Date().toISOString()}));if(p.preserveOriginal)db.legacyBackups.unshift({id:uid(),name:p.name,raw:p.raw,importedAt:new Date().toISOString()});db.drafts.unshift(...incoming);}else db.legacyBackups.unshift({id:uid(),name:p.name,raw:p.raw,importedAt:new Date().toISOString()});pendingImport=null;persist();dom.modal.close();location.hash='#/mine';render();toast(saveError?'已加入本次会话；浏览器保存失败，请导出备份。':'已添加新副本，原记录未被覆盖。');}

function purchaseInput(el,d){if(!d.purchase)d.purchase=emptyPurchase();const p=d.purchase;if(el.dataset.purchaseField){const k=el.dataset.purchaseField;if(!['item','unit','demand','deadline','budget','sameSpec','sameCostBasis','rulesConfirmed'].includes(k))return;p[k]=el.type==='checkbox'?el.checked:el.value;}else{const i=Number(el.dataset.supplierIndex),k=el.dataset.supplierField;if(!Number.isInteger(i)||i<0||i>2||!['name','qualified','price','fixed','moq','capacity','arrival','minimum','exact','baseline'].includes(k))return;p.suppliers[i][k]=el.value;}p.ran=false;p.signature='';purchaseCache.delete(d.id);d.updatedAt=new Date().toISOString();commitWork(d);const target=document.getElementById('purchase-result');if(target)target.innerHTML='<div class="note warning">输入已改变，旧结果已撤下。请核对条件后重新计算。</div>';document.querySelectorAll('[data-action="purchase-export-txt"],[data-action="purchase-export-csv"]').forEach(b=>b.disabled=true);showSave();}

 dom.main.innerHTML=`<div class="purchasepage" data-current-draft="${e(d.id)}"><div class="breadcrumb"><a href="#/map">工作地图</a>${ico('chevron',true)}<a href="#/work/WF-F21">采购适用条件</a>${ico('chevron',true)}<span>同页试算</span></div><div class="detailtop"><div><div class="eyebrow">01 输入条件　→　02 算出组合　→　03 改条件并比较</div><h1>这批货，分别向谁买、买多少？</h1><p class="muted">直接比较总费用、交期和采购承诺。单品 · 三家供应商 · 1—500整数需求；不会自动下单。</p></div><a class="button" href="#/mine">我的工作</a></div><div class="purchase-toolbar"><span class="chip ${p.dataLabel.includes('虚构')?'amber':'teal'}">${e(p.dataLabel)}</span><div class="exporttools"><button data-action="purchase-demo" data-id="${e(d.id)}">载入红队验收样例（虚构）</button><button data-action="purchase-reset" data-id="${e(d.id)}">开始空白新任务</button><button data-action="export-draft-json" data-id="${e(d.id)}">备份输入（JSON）</button></div></div>${d.decisionDescription||d.availableMaterials?`<details class="panel"><summary class="textbutton">查看同一份任务的原始描述与资料</summary><p class="prewrap section-spacer">${e(d.decisionDescription)}</p><p class="prewrap">${e(d.availableMaterials)}</p><p class="note section-spacer">这里的文字原样保留。要整理采购数字，请复制到「粘贴采购说明和报价」；也可以手动填写字段。</p><a href="#/draft/${e(d.id)}/3">返回准备单</a></details>`:''}<section class="panel"><h2>1. 确认同一件采购任务</h2><div class="purchase-task-grid">${purchaseField('item','商品与规格',p.item,'只处理一种已确认规格；不混算替代品。')}${purchaseField('unit','统一数量单位',p.unit,'例如件、箱；三家必须同单位。')}${purchaseField('demand','需求总量（1—500）',p.demand,'恰好满足，不自动超买。','number')}${purchaseField('deadline','最晚到货：第几天',p.deadline,'以共同起点计算；0表示当天。','number')}${purchaseField('budget','预算上限（元，可不设）',p.budget,'空白=没有上限；填0=预算为0。','number')}</div><div class="confirmchecks">${[['sameSpec','报价商品、数量单位和用途已核对一致'],['sameCostBasis','单价按同一税费和币种口径；额外费用只计一次固定费'],['rulesConfirmed','已列明影响决定的硬条件；没有需要本模型外处理的规则']].map(([k,t])=>`<label><input type="checkbox" id="p-${k}" data-purchase-field="${k}" ${p[k]?'checked':''}> ${t}</label>`).join('')}</div></section><section class="panel"><h2>2. 三家报价与采购承诺</h2><p class="sectionintro">空白不是0。固定费仅在该家买货时收取一次；“起订量”只在下单时生效。“至少采购”是下限，“精确锁量”是必须相等。</p><div class="suppliers">${p.suppliers.map((s,i)=>`<article class="supplier"><div class="supplier-title"><label for="p-s${i}-name">供应商 ${i+1}</label><input id="p-s${i}-name" data-supplier-index="${i}" data-supplier-field="name" value="${e(s.name)}" maxlength="120"></div><div class="field"><label for="p-s${i}-qualified">本次供货资格</label><select id="p-s${i}-qualified" data-supplier-index="${i}" data-supplier-field="qualified"><option value="unknown" ${s.qualified==='unknown'?'selected':''}>尚未确认</option><option value="yes" ${s.qualified==='yes'?'selected':''}>已确认合格</option><option value="no" ${s.qualified==='no'?'selected':''}>不满足，本次排除</option></select></div><div class="mini-grid">${supplierField(s,i,'price','每单位价格（元）')}${supplierField(s,i,'fixed','下单一次固定费（元）','没有固定费填0。')}${supplierField(s,i,'moq','起订量','0表示无起订限制。')}${supplierField(s,i,'capacity','最多供多少')}${supplierField(s,i,'arrival','第几天到货','全量到货，同一起点。')}${supplierField(s,i,'minimum','至少采购多少','留空=无额外采购承诺。',true)}${supplierField(s,i,'exact','必须恰好采购多少','留空=不限；填0=禁止采购。',true)}${supplierField(s,i,'baseline','原方案数量','三家都填才比较；不采购填0。',true)}</div></article>`).join('')}</div><div class="purchase-run"><button class="primary" data-action="purchase-solve" data-id="${e(d.id)}">计算采购组合 ${ico('arrow',true)}</button><p class="small muted">只计算，不下单、不付款。不能满足条件时明确说明，不擅自放宽。</p></div></section><section id="purchase-result" class="panel" aria-live="polite">${cached?purchaseResultHtml(cached):'<h2>3. 这里会显示可核对的结果</h2><p class="sectionintro">先填入并确认条件，再点击计算；会给出每家数量、成本拆分、约束检查及原方案对照。</p>'}</section><div class="exporttools purchase-exports"><button class="primary" data-action="purchase-export-txt" data-id="${e(d.id)}" ${!cached?'disabled':''}>导出核算说明（TXT）</button><button data-action="purchase-export-csv" data-id="${e(d.id)}" ${!cached?'disabled':''}>导出输入与结果表（CSV）</button><button data-action="export-draft-json" data-id="${e(d.id)}">下载可恢复备份（JSON）</button></div><p class="small muted section- function purchaseResultHtml(r){if(r.status==='input_required'||r.status==='internal_error')return `<span class="chip amber">未形成方案</span><h2 class="section-spacer">${r.status==='internal_error'?'核验未通过，已停止展示结果':'先补齐或确认这些条件'}</h2><ul class="plainlist">${(r.issues||[]).map(x=>`<li>${e(x.message)}</li>`).join('')}</ul><p class="note section-spacer">已有输入保留，可修改后重试。未知的报价或资格不会被当成0或合格。</p>`;
 const exclusions=r.excluded?.length?`<div class="note section-spacer"><b>不能参与本次供货</b>${r.excluded.map(x=>`<div>${e(x.name)}：${e(x.reason)}</div>`).join('')}</div>`:'';

 const m=r.model,b=r.baseline;return `<div class="resultheadline"><div><span class="chip teal">独立规则核验通过 · 模型内最低费用</span><h2>可行组合已经算出</h2><p class="small muted">${e(m.item)} · 恰好 ${m.demand}${e(m.unit)} · 第${m.deadline}天前到</p></div><div class="result-total"><small>总费用</small><strong>¥${moneyText(r.cost)}</strong></div></div><div class="table-scroll"><table class="purchase-table"><thead><tr><th>供应商</th><th>采购数量</th><th>货款</th><th>固定费</th><th>小计</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${e(x.name)}</td><td><strong>${x.quantity}</strong> ${e(m.unit)}</td><td>¥${moneyText(x.variable)}</td><td>¥${moneyText(x.fixed)}</td><td>¥${moneyText(x.total)}</td></tr>`).join('')}</tbody></table></div><div class="twofields section-spacer"><div class="softbox teal"><h3>原方案能否比较？</h3>${b.valid?`<p>原方案 ¥${moneyText(b.cost)} → 本方案 ¥${moneyText(r.cost)}<br><strong>同条件费用差额 ¥${moneyText(b.saving)}</strong></p><p class="small muted">是这组输入的比较，尚不是企业实际收益。</p>`:`<p>没有可比的合规原方案，不计算节省。</p><p>${e(b.problems.join('；')||'填写三家原采购量后，可以在相同规则下核验。')}</p>`}</div><div class="softbox"><h3>为什么可以称为最低费用？</h3><p>枚举本模型允许的整数组合，找到 ${r.feasibleCount} 个预算内可行组合；最低费用并列 ${r.optimalCount} 个。结果另按原始规则核对数量、费用和限制。</p></div></div>${exclusions}<details class="infodetail section-spacer"><summary><span class="summarybody"><strong>本次检查了哪些约束？</strong></span></summary><div class="infobody"><ul class="plainlist"><li>总量恰好${m.demand}${e(m.unit)}；全部为非负整数。</li><li>购买的供应商合格，且不晚于第${m.deadline}天到货。</li><li>满足起订量、供货上限、最低承诺和精确锁量。</li><li>固定费只对正采购量收取一次；${m.budget===null?'未设置预算上限。':`总费不超过${moneyText(m.budget)}元。`}</li></ul></div></details>${r.alternatives.length>1?`<details class="infodetail"><summary><span class="summarybody"><strong>查看费用排序靠前的可行组合（${r.alternatives.length}个）</strong><span>不是三种不同业务目标；同费用时优先较少供货方，再按固定编号排序。</span></span></summary><div class="infobody">${r.alternatives.map((a,i)=>`<p>${i===0?'当前展示':'可行备选'}：${a.quantities.map((q,j)=>e(m.suppliers[j].name)+' '+q+e(m.unit)).join('、')}；¥${moneyText(a.cost)}</p>`).join('')}</div><             if(!card.standalone)block(clause,line,'家数限制与其他条件写在同一分句。请将条件分开列明，避免遗漏。',{mechanism:'supplier-count-attached'});

          }
          if(/^(?:(?:本批|本次|本单)\s*)?(?:只|仅)(?:能|允许|可)?(?:从|向|由).+(?:采购|买|供货|下单)$/.test(x)){
            block(clause,line,'原话限定了唯一采购对象，当前不能安全转换为选商条件。请提供明确的供方范围后再计算。',{mechanism:'exclusive-supplier'});continue;
          }
          if(pack){
            const named=[...names.keys()].find(n=>x.toLowerCase().startsWith(n));
            const subject=named?r.names[names.get(named)]:current===null?'归属待核':r.names[current];
            r.coverage.push({object:subject,field:'packMultiple',status:'unsupported',...pack,...origin(clause,line)});
            block(clause,line,'「'+subject+'」含整箱或购买倍数要求。现有求解器不能把倍数作为起订量计算；请使用能处理包装约束的工具。',{mechanism:'pack-multiple'});continue;
          }
          if(/通常\s*\d.*(?:元\/|每)|(?:买满|满|达到)\s*\d.*(?:改为|优惠|整单|折扣)/.test(x)){
            const quoteOwner=x.match(/^([\p{Script=Han}A-Za-z _-]{1,30})通常\s*\d/u);
            if(quoteOwner)current=vendor(quoteOwner[1],clause,line);
            block(clause,line,'这份报价可能随购买数量变化。请核实固定单价；当前无法按阶梯报价求解。',{mechanism:'conditional-price'});continue;
          }
          const revised=x.match(RX('^(?:原计划|原来)(?:采购|购买|订|买)\\s*'+N+'\\s*('+U+')\\s*(.+)$','iu'));
          if(revised&&/(?:会议决定)?改成\d/.test(text)){
            projectRevision={item:revised[3],unit:revised[2]};
            r.coverage.push({object:'本次采购',field:'demand',status:'superseded',...origin(clause,line)});continue;
          }
          const update=x.match(RX('^(?:(?:会议)?决定)?(?:改成|调整为|变更为)\\s*'+N+'\\s*('+U+')$','iu'));
          if(update&&projectRevision&&update[2]===projectRevision.unit){addOrderQuantity(update[1],update[2],clause,line,projectRevision.item);projectRevision=null;continue;}
          if(/^(?:原预算|原报价|原名单).*(?:废止|作废|取消|不再有效)/.test(x)){
            const retired=x.match(/^原名单的(.+?)(?:报价|供应商)/)?.[1];if(retired)retiredVendors.add(retired);
            r.coverage.push({object:'历史版本',field:'retired',status:'superseded',...origin(clause,line)});continue;
          }
          const replacement=x.match(/^替换成([\p{Script=Han}A-Za-z_-]{1,32})$/u);
          if(replacement&&retiredVendors.size){current=vendor(replacement[1],clause,line);continue;}
          const quoteList=x.match(/^(?:现有|名单)?(?:另|另外)?(?:两家|三家)(?:仍是|是|为)(.+)$/);
          if(quoteList){
            const spans=[...quoteList[1].matchAll(/(?:^|(?<=\))(?:以及|和|与|及))([\p{Script=Han}A-Za-z_-]+)\(([^()]+)\)/gu)];
            if(spans.length>=2&&spans.map(s=>s[0]).join('')===quoteList[1]){
              for(const span of spans){const i=vendor(span[1],span[0],line);if(i!==null&&!supplier(i,span[2],line))r.unread.push(origin(span[0],line));}
              current=null;continue;
            }
          }
          const forbidden=x.match(/(?:不得|禁止|不能)向([\p{Script=Han}A-Za-z0-9 _-]+?)(?:采购|下单|买)$/u);
          if(forbidden){deferred.push({text:clause,line,type:'forbidden',label:forbidden[1]});continue;}
          if(/(?:单价|报价|费用|运费)\s*[:为]?\s*[−-]\s*\d/.test(x)){
            block(clause,line,'当前费用模型不接受负数报价或折抵；请提供统一且可执行的每单位价格和固定费用。',{mechanism:'negative-quote'});continue;
          }
          const alias=!/^(?:若|如果|报价|合同|签约|本次|本批)/.test(x)&&x.match(/^([\p{Script=Han}A-Za-z _-]+?)(?:\((?:(?:简称|外号)\s*)?([\p{Script=Han}A-Za-z0-9 _-]{1,12})\)|(?:简称|外号)\s*([\p{Script=Han}A-Za-z0-9 _-]{1,12})$)\s*(.*)$/u);
          if(alias){
            const slot=vendor(alias[1],clause,line);const label=(alias[2]||alias[3]).toLowerCase();
            if(slot!==null){if(!shortNames.has(label))shortNames.set(label,new Set());shortNames.get(label).add(slot);current=slot;sharedContext=false;}
            x=alias[4].trim();if(x&&slot!==null&&!supplier(slot,x,line))r.unread.push(origin(clause,line));continue;
          }
          const namedContract=x.match(/^签约的是\s*([\p{Script=Han}A-Za-z0-9 _-]+)\s*:\s*(.*)$/u);
          if(namedContract){contractOwner=owner(namedContract[1]);if(contractOwner!==null)x=namedContract[2];}
          const directCommit=x.match(RX('^(?:补充合同\\s*:\\s*)?(?:(?:本批|本次)\\s*)?(?:合同(?:规定|约定|要求)\\s*)?(?:(?:必须|务必)\\s*)?(?:向|从)?([\\p{Script=Han}A-Za-z0-9 _-]+?)(?:本批|本次)?(?:买|采购|锁定)?(?:正好|恰好|至少|不少于)\\s*'+N+'\\s*('+U+')$','iu'));
          if(directCommit&&owner(directCommit[1])!==null){const i=owner(directCommit[1]);put(i,/正好|恰好/.test(x)?'exact':'minimum',directCommit[2],clause,line,{unit:directCommit[3]});current=i;continue;}
          const conditional=x.match(RX('^若选它须至少'+N+'\\s*('+U+')\\s*(?:\\(可完全不选\\))?$','iu'));
          if(conditional&&current!==null){put(current,'moq',conditional[1],clause,line,{unit:conditional[2]});continue;}
          const boundOwner=x.match(RX('^(?:本批|本次)?至少给它'+N+'\\s*('+U+')$','iu'));
          if(boundOwner&&contractOwner!==null){put(contractOwner,'minimum',boundOwner[1],clause,line,{unit:boundOwner[2]});continue;}
          if(/^(?:另|后|其他)两家(?:无|没有|不)(?:起订(?:量)?|最[低小](?:采购)?量)$/.test(x)){
            deferred.push({text:clause,line,type:x.startsWith('后')?'last-two-moq':'other-moq'});continue;
          }
          const namedNoMoq=x.match(/^(.+?)(?:和|与|及)(.+?)(?:无起订(?:量)?|不起订)$/);
          if(namedNoMoq&&[owner(namedNoMoq[1]),owner(namedNoMoq[2])].every(i=>i!==null)){
            for(const label of namedNoMoq.slice(1))put(owner(label),'moq','0',clause,line);continue;
          }
          if(current!==null&&/^(?:另按|按每|每)(?:公?斤|千克|公斤|吨|米|个|件|张|盒|包|套|只|箱).*(?:运费|物流费|配送费|附加费)/.test(x)){
            block(clause,line,'「'+r.names[current]+'」的费用按用量收取，不能当作每单一次固定费。',{mechanism:'variable-fee'});continue;
          }
          if(/^(?:没有折扣|无折扣)$/.test(x))continue;
          const baselineStart=x.match(/^(?:现行|现有|当前)?原(?:采购)?方案(?:数量)?(?:是|为|[:：])\s*(.*)$/);
          if(baselineStart)baselineContext=true;
          if(baselineContext){
            const b=(baselineStart?.[1]??x).match(RX('^([\\p{Script=Han}A-Za-z][\\p{Script=Han}A-Za-z _-]*?)\\s*'+N+'\\s*('+U+')$','iu'));
            if(b){baselines.push({name:b[1],value:b[2],unit:b[3],text:clause,line});continue;}
            if(baselineStart&&!baselineStart[1])continue;
            baselineContext=false;
          }
          let m;
          // A project deadline is a distinct role, even after the last quote on the same line.
          const deadline=projectDeadline(x);
          if(deadline&&/^(?:最晚|最迟|最长|(?:到货)?截止|第?\s*\d+\s*(?:天|日)(?:内|前))/.test(x)){
            add('deadline',deadline[1],clause,line);current=null;sharedContext=false;continue;
          }
          if(/^(?:(?:下面|上述|以上|现有|已列)?(?:两家|三家|所有|各家|双方|两边|二者|三码)|资格均|均|都|运费均|运费都|无最低量|没有最小量|没有最低采购量)/.test(x)){
            deferred.push({text:x,line,type:'shared'});current=null;sharedContext=true;continue;
          }
          const routed=routeSupplierQuantity(x,line,current);
          if(routed){current=Number.isInteger(routed.slot)?routed.slot:null;sharedContext=false;demandContext=false;continue;}
          const named=[...names.keys()].sort((a,b)=>b.length-a.length).find(n=>x.toLowerCase().startsWith(n)&&!/^[\p{Script=Han}a-z]$/u.test(x.slice(n.length,n.length+1)));
          // Existing Chinese names can be followed by modifiers rather than punctuation.
          const known=[...names.entries()].sort((a,b)=>b[0].length-a[0].length).find(([n])=>x.toLowerCase().startsWith(n)&&(x.length===n.length||/^(?:的|上周|这周|不是|不必|必须|单价|每|\d|[:：]|最多|可供|容量|交期|固定|运费|报价|无|未税|含税|不合格|合格|尚未|未确认|待确认|不符合|符合|不参与|排除|资格|是否|能否|第|全量|全部|一次|当天|在第)/.test(x.slice(n.length))));
          if(known){sharedContext=false;current=known[1];x=x.slice(known[0].length).replace(/^的/,'').replace(/^[:：]\s*/,'');}
          else{
            m=x.match(RX('^(?:供应商\\s*)?([\\p{Script=Han}A-Za-z][\\p{Script=Han}A-Za-z0-9 _-]{0,24}?)\\s*(?=[:：]\\s*(?:合格|不合格|单价|报价|每|\\d)|每(?:'+U+')\\s*\\d|\\d+(?:\\.\\d+)?\\s*元(?:\\/|含税|未税|不含税)|(?:最多供|可供|容量)\\s*\\d|(?:单价|报价)(?:区间|范围)?\\s*(?:可能|约|大概|预计|暂定)?\\s*\\d)','iu'));
            if(m&&!/^(?:需求|预算|采购|买|要|商品|最晚|第|运费|固定费|供货|上限|最多|起订|单位|单价|报价|每|另按|若|原方案|精确|已承诺|最低|最高)/.test(m[1])){sharedContext=false;current=vendor(m[1].replace(/固定$/,''),clause,line);x=x.slice(m[0].length).replace(/^[:：]\s*/,'');}
          }
          if(/^(?:两家|三家|所有|各家|都|均|双方|两边)/.test(x)){
            deferred.push({text:x,line,type:'shared'});current=null;sharedContext=true;continue;
          }
          if(current===null && (!sharedContext||/^(?:预算|无预算|不限预算|没有预算|最晚|最迟|最长|截止|商品|品名|物料|货是|货物为|货品为|单位)/.test(x)) && project(x,line,demandContext&&!sharedContext)){demandContext=demandContext||/(?:需求|采购|购买|需要|买|订|同款|同规格)/.test(x);continue;}
          if(sharedContext||/^(?:运费|起订量)(?:都|均)/.test(x)){deferred.push({text:x,line,type:'shared'});continue;}
          if(current!==null){
            if(x==='未通过资格'||x==='已通过'){put(current,'qualified',x==='已通过'?'yes':'no',clause,line);continue;}
            if(!supplier(current,x,line))r.unread.push(origin(clause,line));continue;
          }
          if(/^(?:没有折扣|无折扣)$/.test(x))continue;
          if(/^(?:无|没有|没|不收|免|不含|不限|运费|起订量|包邮)|运费.*均0/.test(x)){
            deferred.push({text:x,line,type:'shared'});continue;
          }
          if(/箱规|按件验收/.test(x)){ask('pack',clause,line,'箱规是多少件／箱？采购、单价和供货量必须统一单位。本版不自动猜测或换算，请取得统一报价后继续。',{type:'pack'});continue;}
          if(/最好|尽量|分散|不要把所有.*同一家/.test(x)){ask('preference',clause,line,'“分散采购”是必须遵守的要求，还是可选偏好？若是硬条件，请确认各家的最低／最高数量；不能擅自分配比例。',{type:'preference'});continue;}
          if(/(?:无第三家|没有第三家|只有两家|仅有两家|不设第三家)/.test(x)){r.noThird=origin(clause,line);continue;}
          if(/^(?:按整数.*采购|只能整数.*|只比总价|只比总费用|不能多买|不能缺货|交期从现在起算|每家购买时固定费用只收一次|各家的到货日以同一天为起点|交期同一起点|(?:无|没有)原(?:采购)?方案|(?:也)?不接受其他供应商|整件采购|没有折扣|无折扣|不用分批交付|无需分批交货|不需要分批交付|不含其他费用)$/.test(x))continue;

        }
      }
    }
    for(const b of baselines){
      const name=norm(b.name).toLowerCase();
      const hits=names.has(name)?[[name,names.get(name)]]:[...names].filter(([key])=>name.length>=2&&key.startsWith(name));
      if(hits.length===1&&hits[0][1]<3)put(hits[0][1],'baseline',b.value,b.text,b.line,{unit:b.unit});
      else r.unread.push({...origin(b.text,b.line),detail:'原方案的供应商未能唯一对应；不要用未核实的原方案比较节省。'});
    }
    if(versionTable&&!validVersion)block(lines.at(-1),lines.length,'未找到明确的有效报价版本。',{mechanism:'quote-version'});
    if(projectRevision)block(raw,1,'数量修订未明确一致的值和单位，请确认最终需求。',{mechanism:'project-version'});
    // Shared assertions apply only to the listed suppliers, never to invented quotes.
    const sharedZero=raw.match(/(?:运费|起订量)(?:[、，,及和]+(?:运费|起订量))+\s*(?:均|都)?\s*(?:为|是)?0/g)||[];
    for(const z of sharedZero){deferred.push({text:z,line:raw.slice(0,raw.indexOf(z)).split('\n').length,type:'shared'});}
    for(const rule of deferred){
      if(rule.type==='last-two-moq'||rule.type==='other-moq'){
        const obligated=[...new Set(r.requirements.filter(q=>q.field!=='moq'&&Number(q.value)>0).map(q=>q.slot))];
        const two=rule.type==='last-two-moq'?[1,2]:[0,1,2].filter(i=>!obligated.includes(i));
        if(r.names.length===3&&two.length===2)two.forEach(i=>put(i,'moq','0',rule.text,rule.line));

        continue;
      }
      if(rule.type==='forbidden'){
        const i=owner(rule.label);
        if(i!==null)put(i,'qualified','no',rule.text,rule.line);
        else if(retiredVendors.has(rule.label))r.coverage.push({object:rule.label,field:'qualified',value:'no',status:'superseded',...origin(rule.text,rule.line)});
        else block(rule.text,rule.line,'禁采对象「'+rule.label+'」无法与当前报价唯一对应，请核实。',{mechanism:'supplier-ban-owner'});
        continue;
      }
      let x=rule.text.replace(/^(?:下面|上述|以上|现有|已列)?(?:两家|三家|所有|各家|双方|两边|二者|三码)(?:都|均)?/,'').replace(/^(?:都|均)/,'');
      const indices=[...names.values()].filter(i=>i<3);
      let handled=false;
      if(/(?:无|没有|没|不设)(?:起订(?:量|限制)?|最[低小](?:采购)?量)|不起订|起订量.*(?:为|均)?0/.test(x)&&!/^另两家|^后两家/.test(x)){
        indices.forEach(i=>put(i,'moq','0',rule.text,rule.line));handled=true;
      }
      if(/(?:免运(?:费)?|包邮|不收运费|不收服务费|无运费|没有运费)|无起订量和运费|运费.*(?:为|均)?0/.test(x)){
        const type=/服务费/.test(x)&&!/(?:运费|包邮)/.test(x)?'服务费':'运费';
        indices.forEach(i=>addFee(i,type,'0','once',rule.text,rule.line));handled=true;
      }
      const sharedStatus=/^资格(?:均|都)?(?:已)?(?:通过|过)$/.test(x)?'yes':qualificationStatus(x);
      if(sharedStatus!==null){indices.forEach(i=>add('s'+i+'.qualified',sharedStatus==='unknown'?'unknown':sharedStatus,rule.text,rule.line));handled=true;}
      const arrival=x.match(/^(?:都|均)?(?:全部|全量|一次)?(?:在)?第?\s*(\d+)\s*(?:天|日)(?:全部|全量|一次)?(?:到货|到齐|全到|交货|送到|送达|到)$/);
      if(arrival){indices.forEach(i=>put(i,'arrival',arrival[1],rule.text,rule.line));handled=true;}
      if(/^(?:都|均)?(?:在)?当天(?:到货|到齐|送到)$/.test(x)){indices.forEach(i=>put(i,'arrival','0',rule.text,rule.line));handled=true;}
      if(/^(?:报价|价格)(?:均|都)?(?:为|是)?(?:含税人民币价|含税人民币报价|人民币含税价|含税价)$/.test(x)){taxes.add('含税');handled=true;}
      const excludedFees=[...x.matchAll(/(?:不含|未含|不包含|未包含|未计入|不包括|未包括)(运费|运输费|服务费|附加费)/g)];
      for(const match of excludedFees){indices.forEach(i=>feeNotIncluded(i,match[1],rule.text,rule.line));handled=true;}
      const cap=x.match(RX('(?:各能供|最多|上限|各供)\\s*'+N+'\\s*('+U+')?'));
      if(cap){indices.forEach(i=>put(i,'capacity',cap[1],rule.text,rule.line,{unit:cap[2]||''}));handled=true;}
      if(/(?:供货|供应)(?:均|都)?足够/.test(x)){indices.forEach(i=>supplier(i,x,rule.line));handled=true;}
      if(/(?:无|没有|不含)(?:其他|额外)费用/.test(x)){indices.forEach(i=>globalRules.push({...rule,slot:i,type:'other-zero'}));handled=true;}
      if(!handled && !/^(?:没有折扣|无折扣|没有第三家|无第三家)$/.test(x) && !((x==='运费'||x==='起订量')&&sharedZero.length))r.unread.push(origin(rule.text,rule.line));
    }
    for(const rule of globalRules){
      if(!fees.get(rule.slot)?.size&&!feeUnknown.has(rule.slot))addFee(rule.slot,'其他费用','0','once',rule.text,rule.line);
      else if(/无额外费用/.test(rule.text)&&[...fees.get(rule.slot)?.values()||[]].some(f=>Number(f.value)>0)){

      const list=[...fm.values()];
      // A total-fixed column cannot safely be summed with another separately quoted fixed cost.
      if(fm.has('合计固定费')&&list.filter(f=>Number(f.value)>0).length>1){ask('total-fixed-'+i,list.map(f=>f.text).join('；'),list[0].line,'固定费合计与分项费用同时存在，请确认是否重复计入。',{type:'fee-total',slot:i,field:'s'+i+'.fixed'});continue;}
      const cents=list.reduce((n,f)=>n+Math.round(Number(f.value)*100),0);r.knownFeeBase[i]=cents;
      if(!feeUnknown.has(i)){const value=(cents/100).toString();add('s'+i+'.fixed',value,list.map(f=>f.text).join('；'),list[0].line,{basis:'每单一次',interpretation:list.length>1?'已明确的固定费分项合计':'',header:list[0].header||'',headerLine:list[0].headerLine||0});}
    }
    if(taxes.size>1)ask('tax','同时出现含税价和未税价',0,'两家税费口径不同。请确认税率、比较口径，并提供统一口径单价；不能直接拿含税价与未税价比较。',{type:'tax'});
    if(!r.values.unit&&names.size){
      const byVendor=r.names.map((_,i)=>[...new Set(r.sources['s'+i+'.price']?.map(a=>a.unit).filter(Boolean))]);
      const units=[...new Set(byVendor.flat())];
      if(units.length===1&&byVendor.every(u=>u.length===1)){
        const s=r.sources['s0.price'][0];add('unit',units[0],s.text,s.line,{interpretation:'所有列入报价采用同一计价单位'});
      }
    }
    const possible=r.names.filter((_,i)=>i<3&&(r.values['s'+i+'.qualified']!=='no'||r.conflicts['s'+i+'.qualified'])).length;
    for(const constraint of r.coverage.filter(row=>row.type==='supplier-count')){
      const redundant=constraint.value!==null&&(constraint.relation==='at-most'?constraint.value>=possible:constraint.value<=1&&Number(r.values.demand)>0)&&possible>0;
      constraint.status=redundant?'redundant':'unsupported';
      if(!redundant)block(constraint.text,constraint.line,'原话限制可启用的供应商数量（'+constraint.text+'）。现有求解器不能执行这项会影响可行解的限制，已停止计算。',{mechanism:'supplier-count'});
    }
    // Strong unresolved obligations cannot be cleared by the general review checkbox.

function wf3RequestList(m){

  if(!PurchaseIntake.isPath(q.field))continue;
  const own=q.field.match(/^s([0-2])\./)?.[1];
  add('field:'+q.field,wfIntakeAnswerLabel(q.field,m.purchase),own===undefined?'internal':Number(own),q.message);
 }
 for(const q of m.parsed.pendingQuestions||[])add('question:'+q.id,'业务口径确认',q.slot??q.field?.match(/^s([0-2])\./)?.[1]??'internal',q.message);
 for(const [i,q]of (m.parsed.pendingLocks||[]).entries())add('lock:'+i,'采购承诺确认','internal',`${m.purchase.suppliers[q.slot].name}的${q.value}：最低承诺、精确数量或其他含义？需业务确认。`);
 for(const [i,q]of m.unsupported.entries())add('block:'+i,'条件冲突或范围限制','internal',q.message);
 if(m.parsed.unread.length)add('unread','其他原话','internal','还有未明确映射的材料，请核对其含义和是否影响本次决定；不能仅因为已填写数字就忽略。');

function wf3PreparationText(m,x,recipient='internal'){

  for(const q of m.parsed.pendingQuestions||[]){
   if(q.type==='tax')requests.push('请提供本报价的含税／未税口径，以及统一比较所需的信息。');

   if(['fee','fee-missing','fee-total','conflict'].includes(q.type))requests.push('请核实贵方全部附加费用及计费方式；有合计与分项时请说明是否重复。');
   else if(q.type==='version')requests.push('请明确本次有效报价、确认方式及有效期；有多个版本请明确采用哪一版。');
   else if(q.type==='unit-price')requests.push('请明确商品单价的币种与采购单位。');

  requests=[...new Set(requests.filter(Boolean))];
  lines.push(...(requests.length?requests.map((t,i)=>`${i+1}. ${t}`):['没有专属缺项；请核对上述已整理报价是否准确、仍然有效。']));

 }

const IntakePhrases=(()=>{
  const digits='零一二三四五六七八九';
  function smallInteger(word){
    if(/^\d+$/.test(word))return word;
    if(word.length===1&&word!=='十')return String(digits.indexOf(word.replace('两','二')));

  const anchored=s=>new RegExp(`^(?:${s})$`,'u');
  const notes=[
    [/^(?:内部)?项目(?:编号|名(?:称)?)(?:是|为|:)\s*(?:(?:“[^”\n]+”)|(?:「[^」\n]+」)|(?:"[^"\n]+"))$/,'内部项目标识，核算使用采购条款和有效报价。'],
    [/^项目名(?:和|与)(?:这笔|本次|本单)(?:实际)?采购分配方式无关$/,'原文声明项目名称与采购分配无关。'],
    [/^(?:用于同一型号|规格为同一型号)$/,'同型号用途说明。规格仍由核对卡确认。'],
    [/^(?:报价表|报价单)(?:已经|已)定稿$/,'报价状态说明。有效报价仍按逐行对账核实。'],
    [/^若(?:采购员|收货人)?后续发现(?:磕碰|外观破损|外观损伤)$/,'售后处理触发背景，未提出供方筛选或费用条件。'],
    [/^(?:拍照|留存照片)后走正常质保流程即可$/,'到货后的质保操作说明。'],
  ];
  function metadata(x){return notes.find(([p])=>p.test(x))?.[1];}
  function project(x,U){
    let m;
    if((m=x.match(anchored(`(?:采购|品名|采购品名|采购商品)\\s*:\\s*([\\p{L}][\\p{L}\\p{N} _-]{0,35})`))))return [['item',m[1]]];
    const count=`(\\d+)\\s*(${U})`, object='([\\p{L}][\\p{L}\\p{N} _-]{0,35}?)';
    if((m=x.match(anchored(`(?:总共|合计采购|总计采购)\\s*${count}`))))return [['demand',m[1],m[2]],['unit',m[2]]];
    if((m=x.match(anchored(`(?:仓库(?:准备)?补(?:一批)?|想安排|准备采购|订购|请购)\\s*${count}\\s*${object}`))))return [['demand',m[1],m[2]],['unit',m[2]],['item',m[3]]];
    if((m=x.match(anchored(`(?:请购|订购)?${object}\\s*${count}`)))&&!/^(?:供应商|供方|报价|合同|框架|协议|已|给|向|从|到货|第|预算|最多|至少|需要|希望|数量|需求|订单|只|仅|必须|采购方)|(?:容量|供货|确认|报价|报告|安排|先交|先到|只收)/.test(m[1]))return [['item',m[1]],['demand',m[2],m[3]],['unit',m[3]]];
    if((m=x.match(/^(?:(?:总|采购)?预算\s*(?:不超过|不高于|上限|:)?|开支最多)\s*(\d+(?:\.\d{1,2})?)\s*元$/)))return [['budget',m[1]]];

       x.match(anchored(`(?:交货条件是)?(?:下单起|下单后)?${day}\\s*(?:天|日)内(?:全部)?(?:送到|到货|送达|收齐|交齐)`));
    if(clock)return [['deadline',smallInteger(clock[1])]];

  }
  function supplier(x,U){
    const amount='(\\d+(?:\\.\\d{1,2})?)';let m;
    if((m=x.match(anchored(`(?:单价(?:为|:)?|报(?:价(?:为|:)?)?|(?:最终)?含税报价(?:为|:)?|正式(?:报)?价(?:为|是|:)?|确认单价(?:为|:)?)\\s*${amount}\\s*元(?:/|每)\\s*(${U})`))))return ['price',m[1],m[2]];
    if((m=x.match(anchored(`(?:最终|正式)(?:确认)?(?:含税)?(?:报)?价(?:为|是|:)?\\s*每(${U})\\s*${amount}\\s*元`))))return ['price',m[2],m[1]];
    if((m=x.match(anchored(`(?:每单固定费(?:用)?|固定(?:运费|费(?:用)?)每单)\\s*(?:为|:)?\\s*${amount}\\s*元`))))return ['fixed',m[1],'元/单'];
    if((m=x.match(anchored(`(?:可承接|能拿出|可交付|可供货|现货额度(?:为|:)?)\\s*(\\d+)\\s*(${U})`))))return ['capacity',m[1],m[2]];
    if((m=x.match(anchored(`(?:最终确认|确认)?第${day}(?:天|日)(?:到货|到齐|交齐|全到|送达|到)`)))||(m=x.match(anchored(`${day}(?:天|日)后(?:全到|全部到货|交齐)`))))return ['arrival',smallInteger(m[1]),'天'];
    if((m=x.match(anchored(`(?:最终)?确认(?:容量|供货上限|可供)\\s*(\\d+)\\s*(${U})`))))return ['capacity',m[1],m[2]];
    if(/^(?:本次|本批)?(?:准入未通过|不合格|资格不通过|资格未通过)$/.test(x))return ['qualified','no'];

})();

function wf8Receipt(x,p){
  const m=wf8Project(x.raw), blocked=wf8Assess(m,p);
  return m.ledger.rows.map(r=>{
    const affected=blocked.filter(b=>b.line===r.line&&b.column===r.column);
    const path=r.answer&&m.pathFor(r.answer.owner,r.answer.field);
    const current=path&&PurchaseIntake.isPath(path)?p.suppliers[Number(path[1])]?.[r.answer.field]:null;
    const answered=r.answer&&current&&current!=='unknown'&&!affected.length;
    const status=affected.length?'clarify':answered?'mapped':r.status;
    const data=r.facts.map(f=>`${f.object||'本次采购'} · ${PurchaseLedger.labels[f.field]} ${f.relation} ${f.value}${f.unit?' '+f.unit:''}`).join('；');
    return [r.line,r.column,r.text,PurchaseLedger.statuses[status],answered?`人工补充 ${r.answer.owner} · ${PurchaseLedger.labels[r.answer.field]} ${current}`:data,affected[0]?.message||(answered?'按指定字段补充':r.message)];
  });
}

const agentExample='商品：同规格零件X\n单位：件；需求120件；预算1000元；最晚第5天到货\n供应商\t资格\t单价（元/件）\t固定费（元/单）\t起订量（件）\t供货上限（件）\t到货日\t最低采购承诺\nA\t合格\t7\t100\t40\t80\t3\t40\nB\t合格\t8\t0\t20\t120\t2\t\nC\t合格\t6\t0\t20\t120\t8\t';
const agentCleanIntake=wfCleanIntake;
wfCleanIntake=function(input){
  const intake=agentCleanIntake(input);
  if(!intake)return intake;
  if(Array.isArray(input.agentChanges))intake.agentChanges=input.agentChanges.slice(-12).filter(c=>c&&[c.name,c.before,c.after,c.source,c.at].every(v=>typeof v==='string'&&v.length<=300)).map(({name,before,after,source,at})=>({name,before,after,source,at}));
  return intake;
};

function agentProposals(raw,response){
  if(!response||!Array.isArray(response.facts)||response.facts.length>60)throw Error('接口返回格式无法核对。');
  const project=wf8Project(raw), seen=new Set(), accepted=[];
  let rejected=0;
  for(const f of response.facts){
    if(!f||typeof f.path!=='string'||typeof f.value!=='string'||typeof f.text!=='string'||!Number.isInteger(f.line)||!Number.isInteger(f.column)||!PurchaseIntake.isPath(f.path)){
      rejected++;continue;
    }
    if(project.conflicts[f.path]||seen.has(f.path)){
      rejected++;continue;
    }
    const proof=project.sources[f.path]?.find(s=>s.line===f.line&&s.column===f.column&&s.text===f.text&&s.value===f.value);
    if(!proof){rejected++;continue;}
    accepted.push({path:f.path,value:f.value,text:f.text,line:f.line,column:f.column});seen.add(f.path);
  }
  return {accepted,rejected};
}

function agentCapacityRevision(purchase,slot,after){
  const x=purchase?.intake;
  if(!x?.confirmed||!x.raw?.trim()||x.raw!==x.parsedRaw||wf8Gate(purchase))throw Error('请先完成当前资料的核对。');
  if(!/^(?:0|[1-9]\d{0,5})$/.test(after))throw Error('请输入非负整数，并沿用本单数量单位。');
  const prior=wf8Project(x.raw), path=`s${slot}.capacity`, name=prior.names[slot];
  const sources=prior.sources[path];
  if(!name||prior.conflicts[path]||sources?.length!==1)throw Error('这家供方的上限没有唯一出处。请更新对应原话并重新整理。');
  const entry=sources[0],before=entry.value;
  if(before===after)throw Error('供货上限没有变化。');
  const matches=[...entry.text.matchAll(/\d+/g)].filter(m=>m[0]===before);
  const uses=prior.ledger.facts.filter(s=>s.line===entry.line&&s.column===entry.column&&s.text===entry.text);
  if(matches.length!==1||uses.length!==1)throw Error('这段原话含多项条件。请在原资料中明确更新上限。');
  const lines=x.raw.split('\n'), line=lines[entry.line-1], at=entry.column-1;
  if(!line||line.slice(at,at+entry.text.length)!==entry.text)throw Error('出处已经变化。请先重新整理。');
  const offset=at+matches[0].index;
  lines[entry.line-1]=line.slice(0,offset)+after+line.slice(offset+before.length);
  const raw=lines.join('\n'), next=wf8Project(raw);
  const keys=new Set([...Object.keys(prior.values),...Object.keys(next.values)]);
  if(next.unsupported.length||Object.keys(next.conflicts).length||next.values[path]!==after||[...keys].some(k=>k!==path&&prior.values[k]!==next.values[k])){
    throw Error('无法确认只改动了这项供货上限。请更新原资料后核对。');
  }
  return {raw,change:{name,before,after,source:entry.text,at:new Date().toISOString()}};
}

function agentHistory(x){
  const history=x?.agentChanges||[];
  if(!history.length)return '';
  return '<details class="agent-log"><summary>本单供货上限变更记录</summary><ul>'+history.map(c=>`<li>${e(c.name)} ${e(c.before)} → ${e(c.after)}<small>原出处「${e(c.source)}」 · ${e(c.at)}</small></li>`).join('')+'</ul></details>';
}

}

async function agentConnection(button,d){
  const raw=d.purchase.intake?.raw||'',id=d.id;
  const write=message=>{if(button.isConnected&&wfActiveIntake()?.id===id)agentMessage(message);};
  const shelf=dom.main.querySelector('[data-agent-proposals]');if(shelf){shelf.replaceChildren();shelf.hidden=true;}
  button.disabled=true;
  try{
    const status=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(4000)});
    if(!status.ok)throw Error('连接不可用。');
    const state=await status.json();
    if(state.mode!=='fixture'){
      write('真实模型未授权或未配置。可以继续通过本机整理原文。');return;
    }
    if(!raw.trim()){write('请先粘贴采购资料，再核对接口测试数据。');return;}
    const response=await fetch('/api/interpret',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:raw}),signal:AbortSignal.timeout(4000)});
    if(!response.ok)throw Error('接口未返回成功状态。');
    const proposal=agentProposals(raw,await response.json());
    if(!button.isConnected||wfActiveIntake()?.id!==id||d.purchase.intake?.raw!==raw)return;
    write(`接口测试数据 · 已对账 ${proposal.accepted.length} 项，舍弃 ${proposal.rejected} 项。测试数据仅显示在这里。`);
    for(const f of proposal.accepted){const li=document.createElement('li');li.textContent=`第 ${f.line} 行第 ${f.column} 列「${f.text}」`;shelf?.append(li);}
    if(shelf)shelf.hidden=!proposal.accepted.length;
  }catch{write('模型接口不可用或返回无法核对。原话与工作记录已保留，可以继续离线整理。');}
  finally{button.disabled=false;}
}
document.addEventListener('click',ev=>{
  const control=ev.target.closest('[data-agent-action]');if(!control)return;
  const d=wfActiveIntake();if(!d)return;
  const action=control.dataset.agentAction;
  if(action==='source'){agentInput()?.focus();return;}
  if(blocked){agentMessage('浏览器存档处于保护状态。请先导出原始存档或另用干净的浏览器配置。');return;}
  if(action==='model'){void agentConnection(control,d);return;}
  if(action==='example'&&!hasPurchaseInput(d.purchase))agentReparse(d,agentExample,true);
});
document.addEventListener('submit',ev=>{
  if(!ev.target.matches('[data-agent-change]'))return;
  ev.preventDefault();
  const d=wfActiveIntake();if(!d)return;
  if(blocked){agentMessage('存档处于保护状态。原工作未改动。');return;}
  try{
    const result=agentCapacityRevision(d.purchase,Number(document.getElementById('agent-supplier').value),document.getElementById('agent-capacity').value.trim());
    const x=d.purchase.intake;x.agentChanges=[...(x.agentChanges||[]),result.change].slice(-12);
    agentReparse(d,result.raw,x.example);
    const root=dom.main.querySelector('.agent-desk');root.outerHTML=agentPanel(d);
    agentMessage('已更新同一笔采购的原资料，旧结果已撤下。请核对后再计算。');
  }catch(err){agentMessage(err.message||'未更新供货上限。');}
});

  const panel=dom.main.querySelector('.visual-flow');if(!panel||!d?.purchase)return;
  const p=d.purchase,x=p.intake,r=p.ran?purchaseCache.get(d.id)?.result:null;
  const step=r?.status==='optimal'?2:x?.parsedRaw||p.ran?1:0;
  panel.querySelectorAll('li').forEach((li,i)=>{
    if(i===step)li.setAttribute('aria-current','step');else li.removeAttribute('aria-current');
    li.classList.toggle('visual-past',i<step);
  });
  if(panel.dataset.busy)return;
  const message={optimal:'方案已算出。可修改条件、复核或下载。',infeasible:'当前条件无可行方案。可修改条件后重算。',input_required:'还有条件待补充，请核对后再计算。',internal_error:'结果未通过核验，请检查条件后重试。'};
  panel.querySelector('.visual-flow-message').textContent=message[r?.status]||(x?.parsedRaw?'请核对整理后的报价、单位和交期。':'准备商品、数量、交期和每家的报价。');
}
const visualPurchaseBase=purchasePage;
purchasePage=function(id){
  visualPurchaseBase(id);
  const root=dom.main.querySelector('.purchasepage'), d=root&&getDraft(root.dataset.currentDraft);
  if(root&&d){
    root.querySelector('.purchase-toolbar')?.insertAdjacentHTML('afterend',visualFlowMarkup());
    visualFlow(d);visualResultActions();
  }
  if(visualDemoPending){
    visualDemoPending=false;
    const sample=root?.querySelector('[data-agent-action="example"]');
    if(sample){sample.click();root.querySelector('.visual-flow')?.scrollIntoView({block:'start'});}
  }
};
const visualReviewBase=wfRenderIntakeReview;
wfRenderIntakeReview=function(d){visualReviewBase(d);visualFlow(d);};
const visualInvalidateBase=wfIntakeInvalidate;
wfIntakeInvalidate=function(d){visualInvalidateBase(d);visualFlow(d);};
const visualRunBase=runPurchase;
runPurchase=function(id){
  const panel=dom.main.querySelector('.visual-flow');
  const result=document.getElementById('purchase-result');
  if(panel){panel.dataset.busy='true';panel.querySelector('.visual-flow-message').textContent='正在比较符合条件的采购组合…';}
  result?.setAttribute('aria-busy','true');
  try{return visualRunBase(id);}
  finally{result?.removeAttribute('aria-busy');if(panel)delete panel.dataset.busy;visualFlow(getDraft(id));visualResultActions();}
};
const visualConnectionBase=agentConnection;
agentConnection=async function(button,d){
  button.setAttribute('aria-busy','true');agentMessage('正在检查本机模型接口…');
  try{return await visualConnectionBase(button,d);}
  finally{button.removeAttribute('aria-busy');}
};

document.addEventListener('click',ev=>{
  if(ev.target.closest('[data-visual-start]')){
    visualDemoPending=true;location.hash='#/purchase';return;
  }
  if(!ev.target.closest('[data-visual-edit]'))return;
  const input=document.getElementById('agent-capacity');
  if(!input)return;
  input.closest('.agent-desk').scrollIntoView({block:'start'});
  input.focus({preventScroll:true});
});

load();render();
})();
</script></body></html>
